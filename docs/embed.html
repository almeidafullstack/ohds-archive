<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Embed test — OHD Photo Archives</title>
<style>
  body { font-family: 'Bitter', Georgia, serif; background: #e0e0e0; color: #383838; margin: 0; padding: 32px 20px; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1 { font-family: Georgia, serif; font-weight: 400; font-size: 1.6rem; margin: 0 0 6px; }
  p.sub { color: #6b6b6b; font-size: .9rem; margin: 0 0 22px; }
  .frame { border: 1px solid #d2d2d0; background: #fff; border-radius: 4px; overflow: hidden; }
  iframe { display: block; width: 100%; height: 720px; border: 0; }
  @media (max-width: 760px) { iframe { height: 600px; } }
  code { background: #fff; border: 1px solid #d2d2d0; padding: 2px 5px; font-size: .82rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Photo Archives — embed preview</h1>
  <p class="sub">This page mimics how the widget sits inside a Squarespace Code Block.</p>
  <div class="frame">
    <iframe src="./index.html" title="Oregon Historic District Photo Archives" loading="lazy"></iframe>
  </div>
</div>
</body>
</html>
