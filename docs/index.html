<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oregon Historic District — Photo Archives</title>
<meta name="description" content="Browse the Oregon Historic District photo archive by address, street, and year. Dayton, Ohio.">

<!-- No external resources. Fonts, map, and data are all served from this folder. -->
<link rel="stylesheet" href="./fonts.css">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #e0e0e0;
    --surface:  #f4f4f3;
    --panel:    #ffffff;
    --ink:      #383838;
    --ink-soft: #6b6b6b;
    --line:     #d2d2d0;
    --accent:   #ffc700;
    --accent-d: #d9a800;
    --dark:     #1c1c1c;
    --radius:   4px;
    --pill:     999px;
    --serif:    'Young Serif', Georgia, serif;
    --sans:     'Bitter', Georgia, serif;
    --shadow:   0 1px 3px rgba(0,0,0,.10), 0 6px 20px rgba(0,0,0,.06);
    --sidebar-w: 340px;

    /* Basemap palette */
    --map-bg:    #eceae4;
    --map-block: #f7f6f2;
    --map-bldg:  #d5d1c7;
    --map-water: #bfd4dd;
    --map-green: #d8e3cf;
    --map-road:  #ffffff;
    --map-case:  #cdcac2;
    --map-rail:  #b4b1aa;
  }

  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    font-size: 15px;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; color: inherit; cursor: pointer; border: none; background: none; }
  :focus-visible { outline: 2px solid var(--accent-d); outline-offset: 2px; }

  /* ── Toolbar ──────────────────────────────────────── */
  .toolbar {
    flex-shrink: 0;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .toolbar-row { display: flex; gap: 9px; align-items: center; }

  .brandline {
    font-family: var(--serif);
    font-size: 1.05rem;
    letter-spacing: -.01em;
    white-space: nowrap;
    margin-right: 2px;
  }
  .brandline span { color: var(--ink-soft); font-family: var(--sans); font-size: .72rem; font-weight: 400; letter-spacing: .02em; display: block; margin-top: 1px; }

  .search-box { position: relative; flex: 1; min-width: 120px; }
  #search-input {
    width: 100%;
    padding: 8px 30px 8px 12px;
    border: 1px solid var(--line);
    border-radius: var(--pill);
    font-size: .86rem;
    font-family: var(--sans);
    background: var(--surface);
    outline: none;
    color: var(--ink);
  }
  #search-input:focus { border-color: var(--ink); background: #fff; }
  #search-clear {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    font-size: 1.05rem; line-height: 1; color: var(--ink-soft); padding: 2px 4px; display: none;
  }
  #search-input:not(:placeholder-shown) ~ #search-clear { display: block; }

  /* The chips scroll; the label and the mode toggle stay pinned either side. */
  .year-row { display: flex; gap: 8px; align-items: center; min-width: 0; }
  .chiprow { display: flex; gap: 5px; align-items: center; overflow-x: auto; scrollbar-width: thin; padding-bottom: 1px; flex: 1; min-width: 0; }
  .chiprow::-webkit-scrollbar { height: 4px; }
  .chiprow::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  .chip-label {
    font-size: .68rem; text-transform: uppercase; letter-spacing: .09em;
    color: var(--ink-soft); font-weight: 600; white-space: nowrap; padding-right: 3px;
  }
  .chip {
    font-size: .76rem; padding: 4px 11px; border-radius: var(--pill);
    border: 1px solid var(--line); background: var(--surface);
    white-space: nowrap; transition: background .12s, border-color .12s; font-weight: 500;
  }
  .chip:hover { border-color: var(--ink-soft); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--dark); font-weight: 600; }
  .chip-reset { font-size: .74rem; color: var(--ink-soft); text-decoration: underline; text-underline-offset: 2px; white-space: nowrap; padding: 4px 2px; }
  .chip-reset:hover { color: var(--ink); }

  .year-mode {
    flex-shrink: 0;
    font-size: .7rem; color: var(--ink-soft);
    border: 1px solid var(--line); border-radius: var(--pill);
    padding: 3px 10px; white-space: nowrap; background: var(--surface);
  }
  .year-mode:hover { border-color: var(--ink-soft); color: var(--ink); }

  /* ── Timeline ─────────────────────────────────────── */
  .timeline { display: none; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  body.timeline-mode #year-chips { display: none; }
  body.timeline-mode #timeline-main { display: flex; }
  #timeline-lb { display: flex; }

  .tl-track {
    position: relative; flex: 1; height: 26px; cursor: pointer;
    touch-action: none; min-width: 120px;
  }
  .tl-rail {
    position: absolute; left: 0; right: 0; top: 11px; height: 3px;
    background: var(--line); border-radius: 2px;
  }
  .tl-fill {
    position: absolute; left: 0; top: 11px; height: 3px;
    background: var(--accent); border-radius: 2px;
  }
  .tl-tick {
    position: absolute; top: 7px; width: 2px; height: 11px;
    background: #c3bfb6; transform: translateX(-1px); border-radius: 1px;
  }
  .tl-tick.has { background: var(--ink-soft); }
  .tl-tick.dim { opacity: .3; }
  .tl-handle {
    position: absolute; top: 4px; width: 17px; height: 17px;
    background: var(--panel); border: 2px solid var(--dark); border-radius: 50%;
    transform: translateX(-8.5px); box-shadow: var(--shadow); pointer-events: none;
  }
  .tl-label {
    font-size: .74rem; font-weight: 600; min-width: 68px; text-align: right;
    white-space: nowrap; flex-shrink: 0;
  }
  .tl-count { font-size: .66rem; color: var(--ink-soft); min-width: 58px; flex-shrink: 0; }


  /* ── Layout ───────────────────────────────────────── */
  .layout { display: flex; flex: 1; overflow: hidden; position: relative; }

  #sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .sidebar-meta {
    padding: 8px 14px; font-size: .73rem; color: var(--ink-soft);
    border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
  }
  .sidebar-meta-right { display: flex; align-items: center; gap: 12px; }
  #list-close { display: none; }
  .linkbtn { font-size: .72rem; color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
  .linkbtn:hover { color: var(--accent-d); }

  #addr-list { overflow-y: auto; flex: 1; overscroll-behavior: contain; }
  #addr-list::-webkit-scrollbar { width: 8px; }
  #addr-list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }

  /* Street heading doubles as the collapse control; groups start closed so the
     whole district is scannable in one screen. */
  .street-group { border-bottom: 1px solid var(--line); }
  .street-head {
    position: sticky; top: 0; z-index: 2;
    width: 100%; padding: 10px 14px;
    background: var(--panel);
    border: none; text-align: left; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    transition: background .12s;
  }
  .street-head:hover { background: var(--surface); }
  .street-head-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .street-chevron {
    font-size: .58rem; color: var(--ink-soft); flex-shrink: 0;
    transition: transform .16s;
  }
  .street-group.collapsed .street-chevron { transform: rotate(-90deg); }
  .street-group.collapsed .tile-grid { display: none; }
  .street-name { font-family: var(--serif); font-size: .95rem; }
  .street-photo-count { font-size: .68rem; color: var(--ink-soft); white-space: nowrap; }
  .street-group.scenes .street-name::before { content: '◈ '; color: var(--accent-d); }

  .tile-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(138px, 1fr));
    gap: 8px;
    padding: 0 12px 16px;
  }
  .tile {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    text-align: left;
    padding: 0;
    display: flex; flex-direction: column;
    transition: border-color .12s, box-shadow .12s, transform .12s;
  }
  .tile:hover { border-color: var(--ink-soft); box-shadow: var(--shadow); transform: translateY(-1px); }
  .tile.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
  .tile-img {
    width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block;
    background: var(--surface); border-bottom: 1px solid var(--line);
  }
  .tile-img.none {
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-soft); font-size: .7rem;
  }
  .tile-body { padding: 6px 8px 7px; display: flex; flex-direction: column; gap: 1px; }
  .tile-addr { font-size: .8rem; font-weight: 600; line-height: 1.2; }
  .tile-meta { font-size: .66rem; color: var(--ink-soft); }
  /* display:contents lets the cluster's head and its member tiles sit directly in
     the parent grid, so nothing has to re-flow when one expands. */
  .cluster { display: contents; }
  .cluster.collapsed .tile.member { display: none; }

  .cluster-head { position: relative; }
  /* Collapsed, it reads as a stack of cards to signal there is more underneath. */
  .cluster.collapsed .cluster-head { box-shadow: 3px 3px 0 -1px var(--panel), 4px 4px 0 0 var(--line); }
  .cluster.collapsed .cluster-head:hover { box-shadow: 3px 3px 0 -1px var(--panel), 4px 4px 0 0 var(--ink-soft), var(--shadow); }

  .cluster-cta {
    display: block; margin-top: 3px;
    font-size: .64rem; font-weight: 600; color: var(--accent-d);
  }
  /* Expanded, the head steps out of the way: a full-width bar above its members. */
  .cluster:not(.collapsed) .cluster-head {
    grid-column: 1 / -1;
    flex-direction: row; align-items: center; gap: 8px;
    background: var(--surface); border-style: dashed;
  }
  .cluster:not(.collapsed) .cluster-head .tile-img,
  .cluster:not(.collapsed) .cluster-head .tile-span { display: none; }
  .cluster:not(.collapsed) .cluster-head .tile-body { flex-direction: row; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .cluster:not(.collapsed) .cluster-head .cluster-cta { margin-top: 0; margin-left: auto; }

  /* Marks a cover that is one wide shot shared by several addresses, so the
     repeated thumbnail reads as deliberate rather than broken. */
  .tile-span {
    position: absolute; top: 5px; left: 5px;
    background: rgba(28,28,28,.72); color: #f3e6bd;
    font-size: .6rem; font-weight: 600; letter-spacing: .02em;
    border-radius: var(--pill); padding: 1px 6px;
  }
  .tile-count {
    position: absolute; top: 5px; right: 5px;
    background: rgba(28,28,28,.82); color: #fff;
    font-size: .64rem; font-weight: 600;
    border-radius: var(--pill); padding: 1px 7px;
  }
  .tile.active .tile-count { background: var(--accent); color: var(--dark); }

  .empty-note { padding: 24px 16px; text-align: center; color: var(--ink-soft); font-size: .82rem; line-height: 1.6; }

  /* ── SVG map ──────────────────────────────────────── */
  #map { flex: 1; position: relative; overflow: hidden; background: var(--map-bg); }
  .svgmap { touch-action: none; }
  .svgmap-canvas { display: block; cursor: grab; background: var(--map-bg); }
  .svgmap-canvas:active { cursor: grabbing; }

  .lyr path { fill: none; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  .lyr-green  .body { fill: var(--map-green); stroke: none; }
  .lyr-water  .body { fill: var(--map-water); stroke: none; }
  .lyr-building .body { fill: var(--map-bldg); stroke: #c6c1b5; stroke-width: .6; }
  .lyr-rail .casing { stroke: var(--map-rail); stroke-width: 2.4; }
  .lyr-rail .body   { stroke: #fff; stroke-width: 1.1; stroke-dasharray: 5 5; }
  .lyr-path .casing { stroke: none; }
  .lyr-path .body   { stroke: #cfccc4; stroke-width: 1; stroke-dasharray: 3 3; }
  .lyr-road-service .casing { stroke: var(--map-case); stroke-width: 3; }
  .lyr-road-service .body   { stroke: var(--map-road); stroke-width: 2; }
  .lyr-road-minor .casing   { stroke: var(--map-case); stroke-width: 6; }
  .lyr-road-minor .body     { stroke: var(--map-road); stroke-width: 4.5; }
  .lyr-road-arterial .casing{ stroke: #c3bfb6; stroke-width: 8; }
  .lyr-road-arterial .body  { stroke: #fffdf6; stroke-width: 6.5; }
  .lyr-road-major .casing   { stroke: #c8b98f; stroke-width: 9.5; }
  .lyr-road-major .body     { stroke: #fdf3d6; stroke-width: 8; }

  .svgmap-label {
    font-family: var(--sans); font-weight: 500;
    fill: #7d7a72; paint-order: stroke; stroke: var(--map-bg); stroke-width: calc(3px / var(--k));
    text-anchor: middle; dominant-baseline: middle; pointer-events: none;
    font-size: calc(10px / var(--k));
  }
  .svgmap-label.r1 { fill: #6f6a5c; font-weight: 600; font-size: calc(11px / var(--k)); }

  .district-boundary {
    fill: #1c1c1c; fill-opacity: .035;
    stroke: #1c1c1c; stroke-opacity: .5; stroke-width: 1.5;
    stroke-dasharray: 6 5; vector-effect: non-scaling-stroke; pointer-events: none;
  }

  /* Invisible, larger circle under each pin: the actual tap/click target. */
  .svgmap-hit { fill: transparent; stroke: none; cursor: pointer; }
  .svgmap-pin {
    pointer-events: none;            /* the hit circle handles it */
    fill: var(--dark); stroke: #fff; stroke-width: 1.5;
    vector-effect: non-scaling-stroke; cursor: pointer;
  }
  .svgmap-pin-g:hover .svgmap-pin { fill: var(--accent); }
  .svgmap-pin.active { fill: var(--accent); stroke: var(--dark); stroke-width: 2; }

  .svgmap-popup {
    position: absolute; z-index: 500;
    transform: translate(-50%, calc(-100% - 12px));
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow);
    width: 268px; overflow: hidden;
  }
  .svgmap-popup::after {
    content: ''; position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%) rotate(45deg);
    width: 10px; height: 10px; background: var(--panel);
    border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  }
  .popup-thumb { width: 100%; height: 132px; object-fit: cover; display: block; cursor: pointer; background: var(--surface); }
  .popup-body { padding: 9px 11px 11px; }
  .popup-body h3 { font-family: var(--serif); font-size: .95rem; font-weight: 400; margin-bottom: 2px; }
  .popup-meta { font-size: .72rem; color: var(--ink-soft); margin-bottom: 8px; }
  .popup-desc {
    font-size: .74rem; line-height: 1.45; color: var(--ink);
    margin-bottom: 9px; padding-left: 8px; border-left: 2px solid var(--accent);
  }

  /* Gallery strip inside the popup */
  .popup-gallery {
    display: flex; gap: 5px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 9px;
    scrollbar-width: thin;
  }
  .popup-gallery::-webkit-scrollbar { height: 5px; }
  .popup-gallery::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }
  .popup-gallery::-webkit-scrollbar-track { background: transparent; }
  .popup-gthumb {
    position: relative; flex: 0 0 auto; width: 58px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 3px; overflow: hidden; background: var(--surface);
    padding: 0; display: block;
  }
  .popup-gthumb img { width: 100%; height: 42px; object-fit: cover; display: block; }
  .popup-gthumb span {
    display: block; font-size: .58rem; color: var(--ink-soft);
    text-align: center; padding: 1px 0 2px; letter-spacing: .02em;
  }
  .popup-gthumb:hover { border-color: var(--accent-d); }
  .popup-gthumb.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .popup-btn { display: block; width: 100%; padding: 7px; background: var(--accent); color: var(--dark); border-radius: var(--pill); font-size: .78rem; font-weight: 600; text-align: center; }
  .popup-btn:hover { background: var(--accent-d); }

  .svgmap-zoom {
    position: absolute; top: 12px; left: 12px; z-index: 400;
    display: flex; flex-direction: column; border-radius: var(--radius); overflow: hidden;
    border: 1px solid var(--line); box-shadow: var(--shadow);
  }
  .svgmap-zoom button {
    width: 30px; height: 30px; background: var(--panel); font-size: 1.05rem; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .svgmap-zoom button:hover { background: var(--surface); }
  .svgmap-zoom button + button { border-top: 1px solid var(--line); }

  .svgmap-legend {
    position: absolute; top: 12px; left: 52px; z-index: 400;
    display: flex; align-items: center; gap: 7px;
    background: rgba(255,255,255,.88); border: 1px solid var(--line);
    border-radius: var(--pill); padding: 4px 11px 4px 8px;
    font-size: .66rem; color: var(--ink-soft); white-space: nowrap;
  }
  .svgmap-legend svg { display: block; }
  .svgmap-legend circle { fill: var(--dark); stroke: #fff; stroke-width: 1.5; }

  .svgmap-attrib {
    position: absolute; bottom: 0; right: 0; z-index: 400;
    background: rgba(255,255,255,.82); color: var(--ink-soft);
    font-size: .64rem; padding: 2px 7px; border-top-left-radius: var(--radius);
  }

  .map-fab {
    position: absolute; z-index: 600;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--pill); padding: 7px 14px;
    font-size: .78rem; font-weight: 600; box-shadow: var(--shadow);
  }
  .map-fab:hover { background: var(--surface); }
  #reset-view { bottom: 26px; right: 14px; }
  #mobile-list-toggle { display: none; bottom: 26px; left: 14px; }

  /* ── Lightbox ─────────────────────────────────────── */
  #lightbox { display: none; position: fixed; inset: 0; z-index: 4000; background: #141414; flex-direction: column; }
  #lightbox.open { display: flex; }
  .lb-header {
    padding: 13px 58px 11px 20px; color: #fff; flex-shrink: 0;
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    border-bottom: 1px solid rgba(255,255,255,.1);
  }
  .lb-header h2 { font-family: var(--serif); font-size: 1.15rem; font-weight: 400; }
  .lb-header p { font-size: .76rem; color: #a8a8a8; }
  .lb-desc {
    flex-basis: 100%; font-size: .78rem; line-height: 1.5; color: #d8d8d8;
    padding-left: 9px; border-left: 2px solid var(--accent); margin-top: 7px; max-width: 70ch;
  }
  .lb-timeline {
    flex-shrink: 0; padding: 7px 20px 9px;
    border-top: 1px solid rgba(255,255,255,.1);
    background: rgba(0,0,0,.25);
  }
  .lb-timeline .timeline { display: flex; }
  .lb-timeline .tl-rail { background: #4a4a4a; }
  .lb-timeline .tl-tick { background: #6d6d6d; }
  .lb-timeline .tl-tick.has { background: #b9b9b9; }
  .lb-timeline .tl-handle { background: #1c1c1c; border-color: var(--accent); }
  .lb-timeline .tl-label { color: #f0f0f0; }
  .lb-timeline .tl-count { color: #9a9a9a; }
  #lb-close { position: absolute; top: 10px; right: 14px; font-size: 1.7rem; line-height: 1; color: #fff; opacity: .75; padding: 4px 10px; z-index: 10; }
  #lb-close:hover { opacity: 1; }

  .lb-stage { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 12px; min-height: 0; }
  #lb-img { max-width: 100%; max-height: 100%; object-fit: contain; box-shadow: 0 6px 34px rgba(0,0,0,.6); }
  .lb-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    font-size: 1.7rem; color: #fff; background: rgba(0,0,0,.45); border-radius: 50%;
    width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; transition: background .12s;
  }
  .lb-nav:hover { background: var(--accent); color: var(--dark); }
  #lb-prev { left: 14px; } #lb-next { right: 14px; }

  .main-pane { display: contents; }
  #main-tag { display: none; }
  .lb-stage.compare { gap: 10px; padding: 12px; }
  .lb-stage.compare .main-pane {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    flex: 1 1 0; min-width: 0; min-height: 0; height: 100%; gap: 6px;
  }
  .lb-stage.compare .main-pane #lb-img { min-height: 0; flex: 0 1 auto; max-width: 100%; max-height: none; }
  .lb-stage.compare #main-tag { display: block; }
  .cmp-pane { display: none; flex-direction: column; align-items: center; justify-content: center; flex: 1 1 0; min-width: 0; min-height: 0; height: 100%; gap: 6px; }
  .lb-stage.compare .cmp-pane { display: flex; }
  .cmp-pane img { min-height: 0; flex: 0 1 auto; max-width: 100%; object-fit: contain; box-shadow: 0 6px 34px rgba(0,0,0,.6); }
  .cmp-tag { font-size: .7rem; color: var(--accent); text-transform: uppercase; letter-spacing: .1em; font-weight: 600; }

  .lb-footer {
    flex-shrink: 0; padding: 9px 20px; color: #c4c4c4; font-size: .76rem;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    border-top: 1px solid rgba(255,255,255,.1);
  }
  .lb-caption { flex: 1; min-width: 140px; color: #e4e4e4; }
  .lb-action { font-size: .73rem; padding: 4px 12px; border-radius: var(--pill); border: 1px solid rgba(255,255,255,.28); color: #fff; white-space: nowrap; text-decoration: none; }
  .lb-action:hover { background: rgba(255,255,255,.14); }
  .lb-action.on { background: var(--accent); color: var(--dark); border-color: var(--accent); font-weight: 600; }

  .lb-thumbs { flex-shrink: 0; display: flex; gap: 7px; padding: 9px 14px; overflow-x: auto; background: rgba(0,0,0,.4); }
  .lb-thumbs::-webkit-scrollbar { height: 6px; }
  .lb-thumbs::-webkit-scrollbar-thumb { background: #555; border-radius: 6px; }
  .lb-thumb {
    height: 54px; width: 76px; object-fit: cover; flex-shrink: 0;
    border: 2px solid transparent; border-radius: 3px; cursor: pointer;
    opacity: .5; transition: opacity .12s; background: #333;
  }
  .lb-thumb:hover { opacity: .85; }
  .lb-thumb.active { border-color: var(--accent); opacity: 1; }
  .lb-thumb.cmp-pick { border-color: #6ec1ff; opacity: 1; }

  /* ── Mobile ───────────────────────────────────────── */
  @media (max-width: 760px) {
    .brandline { display: none; }
    :root { --sidebar-w: 100%; }
    #sidebar {
      position: absolute; inset: 0; z-index: 1200;
      border-right: none; transform: translateX(-100%); transition: transform .22s ease;
    }
    body.list-open #sidebar { transform: translateX(0); }
    #list-close { display: block; }
    #mobile-list-toggle { display: block; }
    body.list-open #mobile-list-toggle { display: none; }
    body.list-open .svgmap-zoom, body.list-open .svgmap-attrib,
    body.list-open .svgmap-legend { display: none; }
    .svgmap-legend { font-size: .62rem; padding: 3px 9px 3px 6px; gap: 5px; }
    .lb-header { padding: 11px 50px 9px 14px; }
    .lb-header h2 { font-size: 1rem; }
    .lb-nav { width: 36px; height: 36px; font-size: 1.4rem; }
    #lb-prev { left: 6px; } #lb-next { right: 6px; }
    .lb-stage.compare { flex-direction: column; }
    .lb-stage.compare .main-pane, .lb-stage.compare .cmp-pane { flex: 1 1 0; max-width: 100%; min-height: 0; }
    .tile-grid { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); }
    body.timeline-mode .year-row { flex-wrap: wrap; row-gap: 4px; }
    body.timeline-mode #timeline-main { order: 3; flex-basis: 100%; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <div class="toolbar-row">
    <div class="brandline">Photo Archives<span>Oregon Historic District · Dayton, Ohio</span></div>
    <div class="search-box">
      <input id="search-input" type="text" placeholder="Search an address or street…" autocomplete="off" aria-label="Search address or street">
      <button id="search-clear" aria-label="Clear search">×</button>
    </div>
  </div>

    <span class="chip-label">Year</span>
    <div class="chiprow" id="year-chips"></div>
    <div class="timeline" id="timeline-main"></div>

  </div>
</div>

<div class="layout">
  <div id="sidebar">
    <div class="sidebar-meta">
      <span id="sidebar-count"></span>
      <span class="sidebar-meta-right">
        <button class="linkbtn" id="list-close" aria-label="Close list">Close ✕</button>
      </span>
    </div>
    <div id="addr-list"></div>
  </div>
  <div id="map"></div>
  <button class="map-fab" id="reset-view">Reset view</button>
  <button class="map-fab" id="mobile-list-toggle">☰ List</button>
</div>

<div id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button id="lb-close" aria-label="Close">×</button>
  <div class="lb-header">
    <h2 id="lb-title"></h2>
    <p id="lb-subtitle"></p>
    <p class="lb-desc" id="lb-desc" hidden></p>
  </div>
  <div class="lb-stage" id="lb-stage">
    <button class="lb-nav" id="lb-prev" aria-label="Previous photo">‹</button>
    <div class="main-pane" id="main-pane">
      <img id="lb-img" src="" alt="">
      <div class="cmp-tag" id="main-tag"></div>
    </div>
    <div class="cmp-pane" id="cmp-pane">
      <img id="cmp-img" src="" alt="">
      <div class="cmp-tag" id="cmp-tag"></div>
    </div>
    <button class="lb-nav" id="lb-next" aria-label="Next photo">›</button>
  </div>
  <div class="lb-footer">
    <span class="lb-caption" id="lb-caption"></span>
    <span id="lb-counter"></span>
    <button class="lb-action" id="lb-compare">Compare years</button>
    <a class="lb-action" id="lb-full" target="_blank" rel="noopener">Full resolution ↗</a>
  </div>
  <div class="lb-thumbs" id="lb-thumbs"></div>
  <div class="lb-timeline"><div class="timeline" id="timeline-lb"></div></div>
</div>

<script src="./map.js"></script>
<script>
// ── Config ───────────────────────────────────────────────────────────────────
const BUILD = '2026-09-22a';   // bump when data.json or basemap.json changes
const THUMB_URL = './thumbs/';
const VIEW_URL  = './view/';
const FULL_URL  = './view/';   // originals stay offline; see README

const DISTRICT_BOUNDARY = [
  [39.7567803, -84.1877067], [39.7552889, -84.1880046], [39.7544779, -84.1884901],
  [39.7526828, -84.1879968], [39.7530334, -84.1847218], [39.7533345, -84.1814362],
  [39.7542334, -84.1761951], [39.7558479, -84.1767363], [39.7575119, -84.1771918],
  [39.7631203, -84.1787841], [39.7567803, -84.1877067]
];

// ── Path helpers ─────────────────────────────────────────────────────────────
const relPath  = p => p.clean_file || p.file;
const webpPath = p => relPath(p).replace(/\.jpe?g$/i, '.webp');
const thumbSrc = p => THUMB_URL + encodeURI(webpPath(p));
const viewSrc  = p => VIEW_URL  + encodeURI(webpPath(p));
const fullSrc  = p => FULL_URL  + encodeURI(webpPath(p));

// A photo captioned "429-443 E. Sixth St" covers a whole row of buildings, so it
// gets attached to every address in that span. That makes it a poor tile cover:
// filter to 1974 and ten tiles front the same wide shot. Prefer the narrowest span
// available, and fall back to the wide one only when it is genuinely all there is.
const SPAN_RE = /^\s*(\d+)\s*-\s*(\d+)\s/;
function photoSpan(p) {
  const m = SPAN_RE.exec((p.clean_file || p.file).split('/').pop());
  return m ? { lo: Math.min(+m[1], +m[2]), hi: Math.max(+m[1], +m[2]) } : null;
}
const spanWidth = p => { const s = photoSpan(p); return s ? s.hi - s.lo : 0; };

function coverPhoto(photos) {
  if (!photos.length) return null;
  return photos.reduce((best, p) => spanWidth(p) < spanWidth(best) ? p : best, photos[0]);
}

const yearsOf = photos => [...new Set(photos.map(p => p.year).filter(Boolean))].sort();
function yearRange(photos) {
  const y = yearsOf(photos);
  if (!y.length) return 'undated';
  return y.length === 1 ? y[0] : `${y[0]}–${y[y.length - 1]}`;
}

// ── State ────────────────────────────────────────────────────────────────────
let MAP = null;
let ALL_ADDRESSES = [], ALL_SCENES = [];
let activeAddress = null, activeYears = new Set(), searchTerm = '';
let lbEntry = null;   // the address or scene set the viewer is showing
let HOME_RECT = null;

// ── Load ─────────────────────────────────────────────────────────────────────
async function loadData() {
  const [basemap, data] = await Promise.all([
    fetch('./basemap.json?v=' + BUILD).then(r => r.json()),
    fetch('./data.json?v=' + BUILD).then(r => r.json()),
  ]);

  MAP = createMap(document.getElementById('map'), basemap);
  MAP.drawPolygon(DISTRICT_BOUNDARY, 'district-boundary');

  ALL_ADDRESSES = data.addresses;
  ALL_SCENES = data.scenes || [];

  buildYearControl();
  applyFilters();

  // Frame on the photographed addresses, which is tighter than the whole basemap.
  HOME_RECT = MAP.pinsBounds();
  MAP.fitWorldRect(HOME_RECT, 30);

  restoreFromHash();
}

// ── Filtering ────────────────────────────────────────────────────────────────
function matchesFilters(entry) {
  if (searchTerm) {
    const hay = (entry.address + ' ' + entry.street).toLowerCase();
    if (!hay.includes(searchTerm)) return false;
  }
  if (activeYears.size) {
    const has = entry.photos.some(p => activeYears.has(p.year) || (activeYears.has('undated') && !p.year));
    if (!has) return false;
  }
  return true;
}
function visiblePhotos(entry) {
  if (!activeYears.size) return entry.photos;
  return entry.photos.filter(p => activeYears.has(p.year) || (activeYears.has('undated') && !p.year));
}
function applyFilters() {
  const filtered = ALL_ADDRESSES.filter(matchesFilters);
  renderSidebar(filtered);
  placePins(filtered);
  refreshOpenViewer();
}

// ── Year control: chips and timeline over one shared state ───────────────────
// activeYears is the single source of truth. Chips toggle many; the timeline
// picks one. Both views re-sync from the set, so switching modes never lies.
let ALL_YEARS = [], YEAR_COUNTS = {}, TL_STOPS = [];

function buildYearControl() {
  const row = document.getElementById('year-chips');
  YEAR_COUNTS = {};
  ALL_ADDRESSES.forEach(a => a.photos.forEach(p => {
    const k = p.year || 'undated'; YEAR_COUNTS[k] = (YEAR_COUNTS[k] || 0) + 1;
  }));
  ALL_SCENES.forEach(s => { const k = s.year || 'undated'; YEAR_COUNTS[k] = (YEAR_COUNTS[k] || 0) + 1; });

  ALL_YEARS = Object.keys(YEAR_COUNTS).filter(k => k !== 'undated').sort();
  TL_STOPS = ['all', ...ALL_YEARS];
  if (YEAR_COUNTS.undated) TL_STOPS.push('undated');

  const keys = [...ALL_YEARS];
  if (YEAR_COUNTS.undated) keys.push('undated');

  keys.forEach(k => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.dataset.year = k;
    b.textContent = k === 'undated' ? `Undated (${YEAR_COUNTS[k]})` : `${k} (${YEAR_COUNTS[k]})`;
    b.addEventListener('click', () => {
      activeYears.has(k) ? activeYears.delete(k) : activeYears.add(k);
      syncYearUI(); applyFilters();
    });
    row.appendChild(b);
  });

  const reset = document.createElement('button');
  reset.className = 'chip-reset';
  reset.id = 'chip-reset';
  reset.textContent = 'Clear';
  reset.addEventListener('click', () => { activeYears.clear(); syncYearUI(); applyFilters(); });
  row.appendChild(reset);

  buildTimeline(document.getElementById('timeline-main'));
  buildTimeline(document.getElementById('timeline-lb'));

  const modeBtn = document.getElementById('year-mode');
  modeBtn.addEventListener('click', () => {
    const on = document.body.classList.toggle('timeline-mode');
    modeBtn.textContent = on ? 'Year chips ▸' : 'Timeline ▸';
    syncYearUI();
  });

  syncYearUI();
}

function buildTimeline(host) {
  host.innerHTML = `
    <div class="tl-track" role="slider" tabindex="0" aria-label="Filter by year"
         aria-valuemin="0" aria-valuemax="${TL_STOPS.length - 1}">
      <div class="tl-rail"></div><div class="tl-fill"></div>
      <div class="tl-ticks"></div><div class="tl-handle"></div>
    </div>
    <span class="tl-label"></span>
    <span class="tl-count"></span>`;

  const track = host.querySelector('.tl-track');
  const ticks = host.querySelector('.tl-ticks');
  TL_STOPS.forEach((stop, i) => {
    const t = document.createElement('div');
    t.className = 'tl-tick' + (stop === 'all' ? '' : ' has');
    t.style.left = pctFor(i) + '%';
    t.dataset.stop = stop;
    ticks.appendChild(t);
  });

  const pick = clientX => {
    const r = track.getBoundingClientRect();
    const frac = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
    setYearStop(TL_STOPS[Math.round(frac * (TL_STOPS.length - 1))]);
  };
  let sliding = false;
  track.addEventListener('pointerdown', e => {
    sliding = true; track.setPointerCapture(e.pointerId); pick(e.clientX);
  });
  track.addEventListener('pointermove', e => { if (sliding) pick(e.clientX); });
  track.addEventListener('pointerup', () => { sliding = false; });
  track.addEventListener('pointercancel', () => { sliding = false; });
  track.addEventListener('keydown', e => {
    const i = currentStopIndex();
    if (e.key === 'ArrowRight') { setYearStop(TL_STOPS[Math.min(TL_STOPS.length - 1, i + 1)]); e.preventDefault(); }
    if (e.key === 'ArrowLeft')  { setYearStop(TL_STOPS[Math.max(0, i - 1)]); e.preventDefault(); }
  });
}

const pctFor = i => (TL_STOPS.length < 2 ? 0 : (i / (TL_STOPS.length - 1)) * 100);

function currentStopIndex() {
  if (activeYears.size !== 1) return 0;
  const only = [...activeYears][0];
  const i = TL_STOPS.indexOf(only);
  return i < 0 ? 0 : i;
}

function setYearStop(stop) {
  activeYears.clear();
  if (stop && stop !== 'all') activeYears.add(stop);
  syncYearUI();
  applyFilters();
}

// Redraw every year control from activeYears.
function syncYearUI() {
  document.querySelectorAll('.chip[data-year]').forEach(c =>
    c.classList.toggle('on', activeYears.has(c.dataset.year)));
  const reset = document.getElementById('chip-reset');
  if (reset) reset.style.display = activeYears.size ? 'block' : 'none';

  const i = currentStopIndex();
  const stop = TL_STOPS[i];
  const multi = activeYears.size > 1;

  // While the viewer is open, dim the years this address has nothing from.
  const present = lbYears();

  document.querySelectorAll('.timeline').forEach(host => {
    const isLb = host.id === 'timeline-lb';
    host.querySelector('.tl-handle').style.left = pctFor(i) + '%';
    host.querySelector('.tl-fill').style.width = pctFor(i) + '%';
    host.querySelector('.tl-track').setAttribute('aria-valuenow', i);
    host.querySelector('.tl-track').setAttribute('aria-valuetext',
      multi ? `${activeYears.size} years selected` : (stop === 'all' ? 'All years' : stop));
    host.querySelectorAll('.tl-tick').forEach(t =>
      t.classList.toggle('dim', isLb && present && t.dataset.stop !== 'all' && !present.has(t.dataset.stop)));
    host.querySelector('.tl-label').textContent =
      multi ? `${activeYears.size} years` : (stop === 'all' ? 'All years' : (stop === 'undated' ? 'Undated' : stop));
    host.querySelector('.tl-count').textContent =
      multi || stop === 'all' ? '' : `${YEAR_COUNTS[stop] || 0} photos`;
  });
}

// Years available for whatever the viewer currently shows, or null when closed.
function lbYears() {
  if (!lbEntry) return null;
  const src = lbEntry.photos || [];
  const set = new Set(src.map(p => p.year).filter(Boolean));
  if (src.some(p => !p.year)) set.add('undated');
  return set;
}

// ── Sidebar ──────────────────────────────────────────────────────────────────
const openGroups = new Set();          // streets the user has opened, by name

function renderSidebar(addresses) {
  const list = document.getElementById('addr-list');
  const countEl = document.getElementById('sidebar-count');
  list.innerHTML = '';

  const scenes = filteredScenes();
  const totalPhotos = addresses.reduce((s, a) => s + visiblePhotos(a).length, 0);
  countEl.textContent =
    `${addresses.length} address${addresses.length !== 1 ? 'es' : ''} · ${totalPhotos} photo${totalPhotos !== 1 ? 's' : ''}`;

  if (!addresses.length && !scenes.length) {
    list.innerHTML = '<div class="empty-note">Nothing matches this filter.<br>Try another year or clear the search box.</div>';
    return;
  }

  // A search or year filter is a request to see inside, so groups open then.
  const forceOpen = !!searchTerm || activeYears.size > 0;
  const grouped = {};
  addresses.forEach(a => (grouped[a.street] ||= []).push(a));

  // Count how many visible tiles would end up on each cover, so only genuinely
  // repeated ones get labelled.
  const coverUse = new Map();
  addresses.forEach(a => {
    const c = coverPhoto(visiblePhotos(a));
    if (c) coverUse.set(c.clean_file, (coverUse.get(c.clean_file) || 0) + 1);
  });

  const frag = document.createDocumentFragment();

  Object.keys(grouped).sort().forEach(street => {
    const entries = grouped[street];
    const n = entries.reduce((s, a) => s + visiblePhotos(a).length, 0);
    frag.appendChild(makeGroup({
      key: street,
      title: street,
      meta: `${entries.length} addr · ${n} photos`,
      open: forceOpen || openGroups.has(street),
      tiles: buildStreetTiles(entries, coverUse),
    }));
  });

  // Streetscapes are not tied to an address, so they get their own group rather
  // than the separate tab this used to need.
  if (scenes.length) {
    frag.appendChild(makeGroup({
      key: '__scenes',
      title: 'Streetscapes',
      meta: `${scenes.length} view${scenes.length !== 1 ? 's' : ''}`,
      open: forceOpen || openGroups.has('__scenes'),
      scenes: true,
      tiles: scenes.map((sc, i) => makeTile({
        key: 'scene:' + i,
        cover: sceneAsPhoto(sc),
        title: sc.caption,
        meta: sc.year || 'Undated',
        active: false,
        onClick: () => openViewer({
          title: 'Streetscapes',
          entry: { photos: scenes.map(sceneAsPhoto), description: sc.description || '' },
          photos: scenes.map(sceneAsPhoto),
          startIndex: i,
          subtitle: `${scenes.length} view${scenes.length !== 1 ? 's' : ''} · Oregon Historic District`,
        }),
      })),
    }));
  }

  list.appendChild(frag);
}

// Consecutive addresses whose cover resolves to the same photo are folded into one
// cluster tile. Nothing is removed: the cluster expands in place to the real tiles,
// and selecting an address from the map or a deep link opens its cluster first.
function buildStreetTiles(entries, coverUse) {
  // Group by cover rather than by adjacency: the addresses a wide shot covers are
  // not always contiguous once a filter is applied, and leaving the gaps out would
  // still show the same photo twice in one street.
  const runs = new Map();          // cover file -> entries, in first-seen order
  const order = [];
  entries.forEach(entry => {
    const cover = coverPhoto(visiblePhotos(entry));
    const key = cover ? cover.clean_file : '\u0000none:' + entry.address;
    if (!runs.has(key)) { runs.set(key, { cover, list: [] }); order.push(key); }
    runs.get(key).list.push(entry);
  });

  return order.map(key => {
    const { cover, list } = runs.get(key);
    return list.length > 1 ? makeCluster(list, cover) : makeAddressTile(list[0], coverUse);
  });
}

function makeAddressTile(entry, coverUse) {
  const shown = visiblePhotos(entry);
  const cover = coverPhoto(shown);
  const sp = cover && photoSpan(cover);
  const shared = cover && coverUse.get(cover.clean_file) > 1;
  return makeTile({
    key: entry.address,
    cover,
    title: entry.address,
    meta: yearRange(shown),
    count: shown.length,
    span: shared && sp ? `${sp.lo}–${sp.hi}` : null,
    active: entry.address === activeAddress,
    onClick: () => selectAddress(entry),
  });
}

const houseNo = a => { const m = /^(\d+)/.exec(a); return m ? m[1] : a; };

function makeCluster(run, cover) {
  const wrap = document.createElement('div');
  wrap.className = 'cluster collapsed';

  const street = run[0].street;
  // Prefer the span the photo itself claims; it is the truthful extent of the shot
  // even when the filter leaves gaps in which of those addresses are on screen.
  const sp = cover && photoSpan(cover);
  const nums = run.map(e => +houseNo(e.address)).sort((a, b) => a - b);
  const lo = sp ? Math.min(sp.lo, nums[0]) : nums[0];
  const hi = sp ? Math.max(sp.hi, nums[nums.length - 1]) : nums[nums.length - 1];
  const label = `${lo}–${hi} ${street}`;
  const allShown = run.flatMap(visiblePhotos);

  const head = document.createElement('button');
  head.type = 'button';
  head.className = 'tile cluster-head';
  head.setAttribute('aria-expanded', 'false');
  head.innerHTML = `
    ${cover ? `<img class="tile-img" src="${thumbSrc(cover)}" alt="" loading="lazy" decoding="async">` : ''}
    <span class="tile-span">▭ one shared view</span>
    <span class="tile-body">
      <span class="tile-addr">${label}</span>
      <span class="tile-meta">${run.length} addresses · ${yearRange(allShown)}</span>
      <span class="cluster-cta">Show ${run.length} addresses</span>
    </span>`;

  const members = run.map(entry => {
    const t = makeAddressTile(entry, new Map());   // members never re-badge as shared
    t.classList.add('member');
    return t;
  });

  head.addEventListener('click', () => {
    const open = wrap.classList.toggle('collapsed') === false;
    head.setAttribute('aria-expanded', String(open));
    head.querySelector('.cluster-cta').textContent = open ? 'Hide' : `Show ${run.length} addresses`;
  });

  wrap.append(head, ...members);
  return wrap;
}

function makeGroup({ key, title, meta, open, tiles, scenes = false }) {
  const group = document.createElement('div');
  group.className = 'street-group' + (open ? '' : ' collapsed') + (scenes ? ' scenes' : '');
  group.dataset.street = key;

  const head = document.createElement('button');
  head.type = 'button';
  head.className = 'street-head';
  head.setAttribute('aria-expanded', String(!!open));
  head.innerHTML = `
    <span class="street-head-left">
      <span class="street-chevron">▼</span>
      <span class="street-name">${title}</span>
    </span>
    <span class="street-photo-count">${meta}</span>`;
  head.addEventListener('click', () => {
    const nowClosed = group.classList.toggle('collapsed');
    nowClosed ? openGroups.delete(key) : openGroups.add(key);
    head.setAttribute('aria-expanded', String(!nowClosed));
  });

  const grid = document.createElement('div');
  grid.className = 'tile-grid';
  tiles.forEach(t => grid.appendChild(t));

  group.append(head, grid);
  return group;
}

function makeTile({ key, cover, title, meta, count, span = null, active, onClick }) {
  const tile = document.createElement('button');
  tile.type = 'button';
  tile.className = 'tile' + (active ? ' active' : '');
  tile.dataset.address = key;
  tile.innerHTML = `
    ${cover
      ? `<img class="tile-img" src="${thumbSrc(cover)}" alt="" loading="lazy" decoding="async">`
      : `<div class="tile-img none">no photo</div>`}
    ${span ? `<span class="tile-span" title="One wide shot covering ${span}">▭ ${span}</span>` : ''}
    ${count != null ? `<span class="tile-count">${count}</span>` : ''}
    <span class="tile-body">
      <span class="tile-addr">${title}</span>
      <span class="tile-meta">${meta}</span>
    </span>`;
  tile.addEventListener('click', onClick);
  return tile;
}

// ── Streetscapes data ────────────────────────────────────────────────────────
function sceneAsPhoto(s) {
  return { clean_file: s.clean_file || ('_scenes/' + s.original), file: s.file,
           year: s.year, caption: s.caption };
}
function filteredScenes() {
  return ALL_SCENES.filter(s => {
    if (activeYears.size && !(activeYears.has(s.year) || (activeYears.has('undated') && !s.year))) return false;
    if (searchTerm && !s.caption.toLowerCase().includes(searchTerm)) return false;
    return true;
  });
}

// ── Pins ─────────────────────────────────────────────────────────────────────
function placePins(addresses) {
  MAP.clearPins();
  addresses.forEach(entry => {
    if (!entry.lat || !entry.lon) return;
    const shown = visiblePhotos(entry);
    MAP.addPin(entry.address, entry.lat, entry.lon, {
      weight: shown.length,
      data: entry,
      onClick: rec => { setActive(entry.address); MAP.openPopup(rec, buildPopup(entry)); },
    });
  });
  if (activeAddress) MAP.setPinState(activeAddress, 'active');
}

function buildPopup(entry) {
  const shown = visiblePhotos(entry);
  const div = document.createElement('div');
  const cover = coverPhoto(shown);
  const coverIdx = Math.max(0, shown.indexOf(cover));
  const desc = (entry.description || '').trim();

  div.innerHTML = `
    ${cover ? `<img class="popup-thumb" src="${thumbSrc(cover)}" alt="${entry.address}" loading="lazy">` : ''}
    <div class="popup-body">
      <h3>${entry.address}</h3>
      <div class="popup-meta">${shown.length} photo${shown.length !== 1 ? 's' : ''} · ${yearRange(shown)}</div>
      ${desc ? `<div class="popup-desc">${desc}</div>` : ''}
      ${shown.length > 1 ? '<div class="popup-gallery"></div>' : ''}
      <button class="popup-btn">View all photos</button>
    </div>`;

  let previewIndex = coverIdx;
  const gallery = div.querySelector('.popup-gallery');
  if (gallery) {
    shown.forEach((p, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'popup-gthumb' + (i === coverIdx ? ' current' : '');
      b.title = p.year || 'undated';
      b.innerHTML = `<img src="${thumbSrc(p)}" alt="" loading="lazy"><span>${p.year || '—'}</span>`;
      b.addEventListener('click', ev => {
        ev.stopPropagation();
        previewIndex = i;
        const big = div.querySelector('.popup-thumb');
        if (big) big.src = thumbSrc(p);
        div.querySelector('.popup-meta').textContent =
          `${p.year || 'undated'} · photo ${i + 1} of ${shown.length}`;
        gallery.querySelectorAll('.popup-gthumb').forEach((el, n) => el.classList.toggle('current', n === i));
      });
      gallery.appendChild(b);
    });
  }

  div.querySelector('.popup-btn').addEventListener('click', () => openLightbox(entry));
  const big = div.querySelector('.popup-thumb');
  if (big) {
    big.title = 'Open this photo';
    big.addEventListener('click', () => openLightbox(entry, previewIndex));
  }
  return div;
}

// ── Selection ────────────────────────────────────────────────────────────────
function setActive(address) {
  activeAddress = address;
  document.querySelectorAll('.tile').forEach(el => el.classList.toggle('active', el.dataset.address === address));
  const tile = document.querySelector('.tile.active');
  if (tile) {
    tile.closest('.street-group')?.classList.remove('collapsed');
    const cluster = tile.closest('.cluster');
    if (cluster && cluster.classList.contains('collapsed')) {
      cluster.classList.remove('collapsed');
      const head = cluster.querySelector('.cluster-head');
      head.setAttribute('aria-expanded', 'true');
      head.querySelector('.cluster-cta').textContent = 'Hide';
    }
    tile.scrollIntoView({ block: 'nearest' });
  }
  MAP.setPinState(address, 'active');
}

function selectAddress(entry) {
  setActive(entry.address);
  document.body.classList.remove('list-open');
  if (entry.lat && entry.lon) {
    MAP.flyToLatLon(entry.lat, entry.lon, Math.max(MAP.zoom, 6));
    setTimeout(() => MAP.openPopupFor(entry.address, buildPopup(entry)), 440);
  } else {
    openLightbox(entry);
  }
}

// ── Search ───────────────────────────────────────────────────────────────────
const searchInput = document.getElementById('search-input');
searchInput.addEventListener('input', function () {
  searchTerm = this.value.toLowerCase().trim();
  applyFilters();
});
document.getElementById('search-clear').addEventListener('click', () => {
  searchInput.value = ''; searchTerm = ''; applyFilters(); searchInput.focus();
});

// ── Lightbox ─────────────────────────────────────────────────────────────────
let lbPhotos = [], lbIndex = 0, compareMode = false, comparePick = null;

function openLightbox(entry, startIndex = 0) {
  const shown = visiblePhotos(entry);
  openViewer({
    title: entry.address,
    entry,
    photos: shown,
    startIndex,
    subtitle: `${shown.length} photo${shown.length !== 1 ? 's' : ''} · ${yearRange(shown)} · ${entry.street}`,
    canCompare: yearsOf(shown).length > 1,
  });
  location.hash = 'a=' + encodeURIComponent(entry.address);
}

// The year control stays live while the viewer is open, so re-run the open entry
// through the current filter instead of closing on the user.
function refreshOpenViewer() {
  if (!lbEntry) return;
  if (lbEntry.address) {
    const shown = visiblePhotos(lbEntry);
    if (!shown.length) { showViewerEmpty(); return; }
    openViewer({
      title: lbEntry.address,
      entry: lbEntry,
      photos: shown,
      startIndex: 0,
      subtitle: `${shown.length} photo${shown.length !== 1 ? 's' : ''} · ${yearRange(shown)} · ${lbEntry.street}`,
      canCompare: yearsOf(shown).length > 1,
    });
  } else {
    const scenes = filteredScenes();
    if (!scenes.length) { showViewerEmpty(); return; }
    openViewer({
      title: 'Streetscapes',
      entry: { photos: scenes.map(sceneAsPhoto), description: '' },
      photos: scenes.map(sceneAsPhoto),
      startIndex: 0,
      subtitle: `${scenes.length} view${scenes.length !== 1 ? 's' : ''} · Oregon Historic District`,
    });
  }
}

function showViewerEmpty() {
  document.getElementById('lb-img').removeAttribute('src');
  document.getElementById('lb-thumbs').innerHTML = '';
  document.getElementById('lb-counter').textContent = '';
  document.getElementById('lb-caption').textContent = 'Nothing here from the selected year.';
  document.getElementById('lb-compare').style.display = 'none';
  document.getElementById('lb-stage').classList.remove('compare');
}

function openViewer({ title, entry = null, photos, startIndex = 0, subtitle = '', canCompare = false }) {
  if (!photos.length) return;
  lbPhotos = photos; lbIndex = startIndex; lbEntry = entry;
  compareMode = false; comparePick = null;
  document.getElementById('lb-title').textContent = title;
  document.getElementById('lb-subtitle').textContent = subtitle;

  const descEl = document.getElementById('lb-desc');
  const desc = ((entry && entry.description) || '').trim();
  descEl.textContent = desc;
  descEl.hidden = !desc;
  const cmpBtn = document.getElementById('lb-compare');
  cmpBtn.style.display = canCompare ? 'block' : 'none';
  cmpBtn.classList.remove('on');
  cmpBtn.textContent = 'Compare years';
  document.getElementById('lb-stage').classList.remove('compare');
  buildThumbs();
  showPhoto(lbIndex);
  document.getElementById('lightbox').classList.add('open');
  syncYearUI();            // dims the years this entry has nothing from
}

function buildThumbs() {
  const c = document.getElementById('lb-thumbs');
  c.innerHTML = '';
  lbPhotos.forEach((p, i) => {
    const img = document.createElement('img');
    img.className = 'lb-thumb' + (i === lbIndex ? ' active' : '');
    img.src = thumbSrc(p);
    img.loading = 'lazy';
    img.title = p.year || 'undated';
    img.addEventListener('click', () => compareMode ? setComparePick(i) : showPhoto(i));
    c.appendChild(img);
  });
}

function showPhoto(index) {
  lbIndex = index;
  const p = lbPhotos[index];
  const img = document.getElementById('lb-img');
  img.src = viewSrc(p);
  img.alt = p.caption || `${document.getElementById('lb-title').textContent} ${p.year || ''}`.trim();
  document.getElementById('lb-counter').textContent = `${index + 1} / ${lbPhotos.length}`;
  document.getElementById('lb-caption').textContent =
    (p.caption || p.original || '').replace(/\.jpe?g$/i, '') + (p.year ? '' : '  (undated)');
  document.getElementById('lb-full').href = fullSrc(p);
  document.getElementById('main-tag').textContent = p.year || 'undated';
  document.querySelectorAll('.lb-thumb').forEach((el, i) => el.classList.toggle('active', i === index));
  document.querySelector('.lb-thumb.active')?.scrollIntoView({ inline: 'nearest', block: 'nearest' });
  if (compareMode) updateComparePane();
  [index - 1, index + 1].forEach(i => { if (lbPhotos[i]) new Image().src = viewSrc(lbPhotos[i]); });
}

function setComparePick(i) {
  comparePick = i;
  updateComparePane();
}
function updateComparePane() {
  if (comparePick == null) {
    const cur = lbPhotos[lbIndex].year;
    let best = null, bestGap = -1;
    lbPhotos.forEach((p, i) => {
      if (i === lbIndex || !p.year || !cur) return;
      const gap = Math.abs(+p.year - +cur);
      if (gap > bestGap) { bestGap = gap; best = i; }
    });
    comparePick = best != null ? best : (lbIndex + 1) % lbPhotos.length;
  }
  const p = lbPhotos[comparePick];
  document.getElementById('cmp-img').src = viewSrc(p);
  document.getElementById('cmp-tag').textContent = p.year || 'undated';
  document.querySelectorAll('.lb-thumb').forEach((el, n) => el.classList.toggle('cmp-pick', n === comparePick));
}
document.getElementById('lb-compare').addEventListener('click', function () {
  compareMode = !compareMode;
  this.classList.toggle('on', compareMode);
  this.textContent = compareMode ? 'Pick from strip ↓' : 'Compare years';
  document.getElementById('lb-stage').classList.toggle('compare', compareMode);
  if (compareMode) updateComparePane();
  else { comparePick = null; document.querySelectorAll('.lb-thumb').forEach(el => el.classList.remove('cmp-pick')); }
});

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  lbEntry = null;
  syncYearUI();
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
}
document.getElementById('lb-close').addEventListener('click', closeLightbox);
document.getElementById('lb-prev').addEventListener('click', () => showPhoto((lbIndex - 1 + lbPhotos.length) % lbPhotos.length));
document.getElementById('lb-next').addEventListener('click', () => showPhoto((lbIndex + 1) % lbPhotos.length));
document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target.id === 'lightbox' || e.target.id === 'lb-stage') closeLightbox();
});
document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowRight') showPhoto((lbIndex + 1) % lbPhotos.length);
  if (e.key === 'ArrowLeft') showPhoto((lbIndex - 1 + lbPhotos.length) % lbPhotos.length);
});

// ── Map controls ─────────────────────────────────────────────────────────────
document.getElementById('reset-view').addEventListener('click', () => {
  activeAddress = null;
  document.querySelectorAll('.tile').forEach(el => el.classList.remove('active'));
  MAP.setPinState(null, null);
  MAP.closePopup();
  MAP.fitWorldRect(HOME_RECT || MAP.pinsBounds(), 30, true);
});
document.getElementById('mobile-list-toggle').addEventListener('click', () => document.body.classList.add('list-open'));
document.getElementById('list-close').addEventListener('click', () => document.body.classList.remove('list-open'));

// ── Deep link ────────────────────────────────────────────────────────────────
function restoreFromHash() {
  const m = /a=([^&]+)/.exec(location.hash);
  if (!m) return;
  const addr = decodeURIComponent(m[1]);
  const entry = ALL_ADDRESSES.find(a => a.address === addr);
  if (entry) { setActive(addr); openLightbox(entry); }
}

loadData();
</script>
