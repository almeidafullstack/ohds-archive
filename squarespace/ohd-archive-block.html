     Oregon Historic District — Photo Archives
     Single Squarespace Code Block. Paste whole; do not reformat.
     Built by build_squarespace.py from widget/. Edit there, not here.

     Set OHD_IMG.base below to wherever the photo derivatives live.

<div id="ohd-archive">


<div class="toolbar">
  <div class="toolbar-row">
    <div class="brandline">Photo Archives<span>Oregon Historic District · Dayton, Ohio</span></div>
    <div class="search-box">
      <input id="search-input" type="text" placeholder="Search an address or street…" autocomplete="off" aria-label="Search address or street">
      <button id="search-clear" aria-label="Clear search">×</button>
    </div>
  </div>
  <div class="year-row">
    <span class="chip-label">Year</span>
    <div class="chiprow" id="year-chips"></div>
    <div class="timeline" id="timeline-main"></div>
    <button class="year-mode" id="year-mode">Timeline ▸</button>
  </div>
</div>

<div class="layout">
  <div id="sidebar">
    <div class="sidebar-meta">
      <span id="sidebar-count"></span>
      <span class="sidebar-meta-right">
        <button class="linkbtn" id="list-close" aria-label="Close list">Close ✕</button>
      </span>
    </div>
    <div id="addr-list"></div>
  </div>
  <div id="map"></div>
  <button class="map-fab" id="reset-view">Reset view</button>
  <button class="map-fab" id="mobile-list-toggle">☰ List</button>
</div>

<div id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button id="lb-close" aria-label="Close">×</button>
  <div class="lb-header">
    <h2 id="lb-title"></h2>
    <p id="lb-subtitle"></p>
    <p class="lb-desc" id="lb-desc" hidden></p>
  </div>
  <div class="lb-stage" id="lb-stage">
    <button class="lb-nav" id="lb-prev" aria-label="Previous photo">‹</button>
    <div class="main-pane" id="main-pane">
      <img id="lb-img" src="" alt="">
      <div class="cmp-tag" id="main-tag"></div>
    </div>
    <div class="cmp-pane" id="cmp-pane">
      <img id="cmp-img" src="" alt="">
      <div class="cmp-tag" id="cmp-tag"></div>
    </div>
    <button class="lb-nav" id="lb-next" aria-label="Next photo">›</button>
  </div>
  <div class="lb-footer">
    <span class="lb-caption" id="lb-caption"></span>
    <span id="lb-counter"></span>
    <button class="lb-action" id="lb-compare">Compare years</button>
    <a class="lb-action" id="lb-full" target="_blank" rel="noopener">Full resolution ↗</a>
  </div>
  <div class="lb-thumbs" id="lb-thumbs"></div>
  <div class="lb-timeline"><div class="timeline" id="timeline-lb"></div></div>
</div>

</div>

<style>
#ohd-archive { height: min(78vh, 760px); min-height: 480px; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; contain: layout paint; }

  #ohd-archive *, #ohd-archive *::before, #ohd-archive *::after { box-sizing: border-box; margin: 0; padding: 0; }

  #ohd-archive {
    --bg:       #e0e0e0;
    --surface:  #f4f4f3;
    --panel:    #ffffff;
    --ink:      #383838;
    --ink-soft: #6b6b6b;
    --line:     #d2d2d0;
    --accent:   #ffc700;
    --accent-d: #d9a800;
    --dark:     #1c1c1c;
    --radius:   4px;
    --pill:     999px;
    --serif:    'Young Serif', Georgia, serif;
    --sans:     'Bitter', Georgia, serif;
    --shadow:   0 1px 3px rgba(0,0,0,.10), 0 6px 20px rgba(0,0,0,.06);
    --sidebar-w: 340px;

    /* Basemap palette */
    --map-bg:    #eceae4;
    --map-block: #f7f6f2;
    --map-bldg:  #d5d1c7;
    --map-water: #bfd4dd;
    --map-green: #d8e3cf;
    --map-road:  #ffffff;
    --map-case:  #cdcac2;
    --map-rail:  #b4b1aa;
  }

  #ohd-archive, #ohd-archive { height: 100%; }
  #ohd-archive {
    font-family: var(--sans);
    font-size: 15px;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #ohd-archive button { font-family: inherit; color: inherit; cursor: pointer; border: none; background: none; }
  #ohd-archive :focus-visible { outline: 2px solid var(--accent-d); outline-offset: 2px; }

  #ohd-archive /* ── Toolbar ──────────────────────────────────────── */
  .toolbar {
    flex-shrink: 0;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  #ohd-archive .toolbar-row { display: flex; gap: 9px; align-items: center; }

  #ohd-archive .brandline {
    font-family: var(--serif);
    font-size: 1.05rem;
    letter-spacing: -.01em;
    white-space: nowrap;
    margin-right: 2px;
  }
  #ohd-archive .brandline span { color: var(--ink-soft); font-family: var(--sans); font-size: .72rem; font-weight: 400; letter-spacing: .02em; display: block; margin-top: 1px; }

  #ohd-archive .search-box { position: relative; flex: 1; min-width: 120px; }
  #ohd-archive #search-input {
    width: 100%;
    padding: 8px 30px 8px 12px;
    border: 1px solid var(--line);
    border-radius: var(--pill);
    font-size: .86rem;
    font-family: var(--sans);
    background: var(--surface);
    outline: none;
    color: var(--ink);
  }
  #ohd-archive #search-input:focus { border-color: var(--ink); background: #fff; }
  #ohd-archive #search-clear {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    font-size: 1.05rem; line-height: 1; color: var(--ink-soft); padding: 2px 4px; display: none;
  }
  #ohd-archive #search-input:not(:placeholder-shown) ~ #search-clear { display: block; }

  #ohd-archive /* The chips scroll; the label and the mode toggle stay pinned either side. */
  .year-row { display: flex; gap: 8px; align-items: center; min-width: 0; }
  #ohd-archive .chiprow { display: flex; gap: 5px; align-items: center; overflow-x: auto; scrollbar-width: thin; padding-bottom: 1px; flex: 1; min-width: 0; }
  #ohd-archive .chiprow::-webkit-scrollbar { height: 4px; }
  #ohd-archive .chiprow::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  #ohd-archive .chip-label {
    font-size: .68rem; text-transform: uppercase; letter-spacing: .09em;
    color: var(--ink-soft); font-weight: 600; white-space: nowrap; padding-right: 3px;
  }
  #ohd-archive .chip {
    font-size: .76rem; padding: 4px 11px; border-radius: var(--pill);
    border: 1px solid var(--line); background: var(--surface);
    white-space: nowrap; transition: background .12s, border-color .12s; font-weight: 500;
  }
  #ohd-archive .chip:hover { border-color: var(--ink-soft); }
  #ohd-archive .chip.on { background: var(--accent); border-color: var(--accent); color: var(--dark); font-weight: 600; }
  #ohd-archive .chip-reset { font-size: .74rem; color: var(--ink-soft); text-decoration: underline; text-underline-offset: 2px; white-space: nowrap; padding: 4px 2px; }
  #ohd-archive .chip-reset:hover { color: var(--ink); }

  #ohd-archive .year-mode {
    flex-shrink: 0;
    font-size: .7rem; color: var(--ink-soft);
    border: 1px solid var(--line); border-radius: var(--pill);
    padding: 3px 10px; white-space: nowrap; background: var(--surface);
  }
  #ohd-archive .year-mode:hover { border-color: var(--ink-soft); color: var(--ink); }

  #ohd-archive /* ── Timeline ─────────────────────────────────────── */
  .timeline { display: none; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  #ohd-archive.timeline-mode #year-chips { display: none; }
  #ohd-archive.timeline-mode #timeline-main { display: flex; }
  #ohd-archive #timeline-lb { display: flex; }

  #ohd-archive .tl-track {
    position: relative; flex: 1; height: 26px; cursor: pointer;
    touch-action: none; min-width: 120px;
  }
  #ohd-archive .tl-rail {
    position: absolute; left: 0; right: 0; top: 11px; height: 3px;
    background: var(--line); border-radius: 2px;
  }
  #ohd-archive .tl-fill {
    position: absolute; left: 0; top: 11px; height: 3px;
    background: var(--accent); border-radius: 2px;
  }
  #ohd-archive .tl-tick {
    position: absolute; top: 7px; width: 2px; height: 11px;
    background: #c3bfb6; transform: translateX(-1px); border-radius: 1px;
  }
  #ohd-archive .tl-tick.has { background: var(--ink-soft); }
  #ohd-archive .tl-tick.dim { opacity: .3; }
  #ohd-archive .tl-handle {
    position: absolute; top: 4px; width: 17px; height: 17px;
    background: var(--panel); border: 2px solid var(--dark); border-radius: 50%;
    transform: translateX(-8.5px); box-shadow: var(--shadow); pointer-events: none;
  }
  #ohd-archive .tl-label {
    font-size: .74rem; font-weight: 600; min-width: 68px; text-align: right;
    white-space: nowrap; flex-shrink: 0;
  }
  #ohd-archive .tl-count { font-size: .66rem; color: var(--ink-soft); min-width: 58px; flex-shrink: 0; }


  #ohd-archive /* ── Layout ───────────────────────────────────────── */
  .layout { display: flex; flex: 1; overflow: hidden; position: relative; }

  #ohd-archive #sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #ohd-archive .sidebar-meta {
    padding: 8px 14px; font-size: .73rem; color: var(--ink-soft);
    border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
  }
  #ohd-archive .sidebar-meta-right { display: flex; align-items: center; gap: 12px; }
  #ohd-archive #list-close { display: none; }
  #ohd-archive .linkbtn { font-size: .72rem; color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
  #ohd-archive .linkbtn:hover { color: var(--accent-d); }

  #ohd-archive #addr-list { overflow-y: auto; flex: 1; overscroll-behavior: contain; }
  #ohd-archive #addr-list::-webkit-scrollbar { width: 8px; }
  #ohd-archive #addr-list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }

  #ohd-archive /* Street heading doubles as the collapse control; groups start closed so the
     whole district is scannable in one screen. */
  .street-group { border-bottom: 1px solid var(--line); }
  #ohd-archive .street-head {
    position: sticky; top: 0; z-index: 2;
    width: 100%; padding: 10px 14px;
    background: var(--panel);
    border: none; text-align: left; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    transition: background .12s;
  }
  #ohd-archive .street-head:hover { background: var(--surface); }
  #ohd-archive .street-head-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
  #ohd-archive .street-chevron {
    font-size: .58rem; color: var(--ink-soft); flex-shrink: 0;
    transition: transform .16s;
  }
  #ohd-archive .street-group.collapsed .street-chevron { transform: rotate(-90deg); }
  #ohd-archive .street-group.collapsed .tile-grid { display: none; }
  #ohd-archive .street-name { font-family: var(--serif); font-size: .95rem; }
  #ohd-archive .street-photo-count { font-size: .68rem; color: var(--ink-soft); white-space: nowrap; }
  #ohd-archive .street-group.scenes .street-name::before { content: '◈ '; color: var(--accent-d); }

  #ohd-archive .tile-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(138px, 1fr));
    gap: 8px;
    padding: 0 12px 16px;
  }
  #ohd-archive .tile {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    text-align: left;
    padding: 0;
    display: flex; flex-direction: column;
    transition: border-color .12s, box-shadow .12s, transform .12s;
  }
  #ohd-archive .tile:hover { border-color: var(--ink-soft); box-shadow: var(--shadow); transform: translateY(-1px); }
  #ohd-archive .tile.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
  #ohd-archive .tile-img {
    width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block;
    background: var(--surface); border-bottom: 1px solid var(--line);
  }
  #ohd-archive .tile-img.none {
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-soft); font-size: .7rem;
  }
  #ohd-archive .tile-body { padding: 6px 8px 7px; display: flex; flex-direction: column; gap: 1px; }
  #ohd-archive .tile-addr { font-size: .8rem; font-weight: 600; line-height: 1.2; }
  #ohd-archive .tile-meta { font-size: .66rem; color: var(--ink-soft); }
  #ohd-archive .tile-count {
    position: absolute; top: 5px; right: 5px;
    background: rgba(28,28,28,.82); color: #fff;
    font-size: .64rem; font-weight: 600;
    border-radius: var(--pill); padding: 1px 7px;
  }
  #ohd-archive .tile.active .tile-count { background: var(--accent); color: var(--dark); }

  #ohd-archive .empty-note { padding: 24px 16px; text-align: center; color: var(--ink-soft); font-size: .82rem; line-height: 1.6; }

  #ohd-archive /* ── SVG map ──────────────────────────────────────── */
  #map { flex: 1; position: relative; overflow: hidden; background: var(--map-bg); }
  #ohd-archive .svgmap { touch-action: none; }
  #ohd-archive .svgmap-canvas { display: block; cursor: grab; background: var(--map-bg); }
  #ohd-archive .svgmap-canvas:active { cursor: grabbing; }

  #ohd-archive .lyr path { fill: none; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  #ohd-archive .lyr-green  .body { fill: var(--map-green); stroke: none; }
  #ohd-archive .lyr-water  .body { fill: var(--map-water); stroke: none; }
  #ohd-archive .lyr-building .body { fill: var(--map-bldg); stroke: #c6c1b5; stroke-width: .6; }
  #ohd-archive .lyr-rail .casing { stroke: var(--map-rail); stroke-width: 2.4; }
  #ohd-archive .lyr-rail .body { stroke: #fff; stroke-width: 1.1; stroke-dasharray: 5 5; }
  #ohd-archive .lyr-path .casing { stroke: none; }
  #ohd-archive .lyr-path .body { stroke: #cfccc4; stroke-width: 1; stroke-dasharray: 3 3; }
  #ohd-archive .lyr-road-service .casing { stroke: var(--map-case); stroke-width: 3; }
  #ohd-archive .lyr-road-service .body { stroke: var(--map-road); stroke-width: 2; }
  #ohd-archive .lyr-road-minor .casing { stroke: var(--map-case); stroke-width: 6; }
  #ohd-archive .lyr-road-minor .body { stroke: var(--map-road); stroke-width: 4.5; }
  #ohd-archive .lyr-road-arterial .casing { stroke: #c3bfb6; stroke-width: 8; }
  #ohd-archive .lyr-road-arterial .body { stroke: #fffdf6; stroke-width: 6.5; }
  #ohd-archive .lyr-road-major .casing { stroke: #c8b98f; stroke-width: 9.5; }
  #ohd-archive .lyr-road-major .body { stroke: #fdf3d6; stroke-width: 8; }

  #ohd-archive .svgmap-label {
    font-family: var(--sans); font-weight: 500;
    fill: #7d7a72; paint-order: stroke; stroke: var(--map-bg); stroke-width: calc(3px / var(--k));
    text-anchor: middle; dominant-baseline: middle; pointer-events: none;
    font-size: calc(10px / var(--k));
  }
  #ohd-archive .svgmap-label.r1 { fill: #6f6a5c; font-weight: 600; font-size: calc(11px / var(--k)); }

  #ohd-archive .district-boundary {
    fill: #1c1c1c; fill-opacity: .035;
    stroke: #1c1c1c; stroke-opacity: .5; stroke-width: 1.5;
    stroke-dasharray: 6 5; vector-effect: non-scaling-stroke; pointer-events: none;
  }

  #ohd-archive /* Invisible, #ohd-archive larger circle under each pin: the actual tap/click target. */
  .svgmap-hit { fill: transparent; stroke: none; cursor: pointer; }
  #ohd-archive .svgmap-pin {
    pointer-events: none;            /* the hit circle handles it */
    fill: var(--dark); stroke: #fff; stroke-width: 1.5;
    vector-effect: non-scaling-stroke; cursor: pointer;
  }
  #ohd-archive .svgmap-pin.big { fill: var(--accent-d); }
  #ohd-archive .svgmap-pin-g:hover .svgmap-pin { fill: var(--accent); }
  #ohd-archive .svgmap-pin.active { fill: var(--accent); stroke: var(--dark); stroke-width: 2; }

  #ohd-archive .svgmap-popup {
    position: absolute; z-index: 500;
    transform: translate(-50%, calc(-100% - 12px));
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow);
    width: 268px; overflow: hidden;
  }
  #ohd-archive .svgmap-popup::after {
    content: ''; position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%) rotate(45deg);
    width: 10px; height: 10px; background: var(--panel);
    border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  }
  #ohd-archive .popup-thumb { width: 100%; height: 132px; object-fit: cover; display: block; cursor: pointer; background: var(--surface); }
  #ohd-archive .popup-body { padding: 9px 11px 11px; }
  #ohd-archive .popup-body h3 { font-family: var(--serif); font-size: .95rem; font-weight: 400; margin-bottom: 2px; }
  #ohd-archive .popup-meta { font-size: .72rem; color: var(--ink-soft); margin-bottom: 8px; }
  #ohd-archive .popup-desc {
    font-size: .74rem; line-height: 1.45; color: var(--ink);
    margin-bottom: 9px; padding-left: 8px; border-left: 2px solid var(--accent);
  }

  #ohd-archive /* Gallery strip inside the popup */
  .popup-gallery {
    display: flex; gap: 5px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 9px;
    scrollbar-width: thin;
  }
  #ohd-archive .popup-gallery::-webkit-scrollbar { height: 5px; }
  #ohd-archive .popup-gallery::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }
  #ohd-archive .popup-gallery::-webkit-scrollbar-track { background: transparent; }
  #ohd-archive .popup-gthumb {
    position: relative; flex: 0 0 auto; width: 58px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 3px; overflow: hidden; background: var(--surface);
    padding: 0; display: block;
  }
  #ohd-archive .popup-gthumb img { width: 100%; height: 42px; object-fit: cover; display: block; }
  #ohd-archive .popup-gthumb span {
    display: block; font-size: .58rem; color: var(--ink-soft);
    text-align: center; padding: 1px 0 2px; letter-spacing: .02em;
  }
  #ohd-archive .popup-gthumb:hover { border-color: var(--accent-d); }
  #ohd-archive .popup-gthumb.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  #ohd-archive .popup-btn { display: block; width: 100%; padding: 7px; background: var(--accent); color: var(--dark); border-radius: var(--pill); font-size: .78rem; font-weight: 600; text-align: center; }
  #ohd-archive .popup-btn:hover { background: var(--accent-d); }

  #ohd-archive .svgmap-zoom {
    position: absolute; top: 12px; left: 12px; z-index: 400;
    display: flex; flex-direction: column; border-radius: var(--radius); overflow: hidden;
    border: 1px solid var(--line); box-shadow: var(--shadow);
  }
  #ohd-archive .svgmap-zoom button {
    width: 30px; height: 30px; background: var(--panel); font-size: 1.05rem; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  #ohd-archive .svgmap-zoom button:hover { background: var(--surface); }
  #ohd-archive .svgmap-zoom button + button { border-top: 1px solid var(--line); }

  #ohd-archive .svgmap-attrib {
    position: absolute; bottom: 0; right: 0; z-index: 400;
    background: rgba(255,255,255,.82); color: var(--ink-soft);
    font-size: .64rem; padding: 2px 7px; border-top-left-radius: var(--radius);
  }

  #ohd-archive .map-fab {
    position: absolute; z-index: 600;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--pill); padding: 7px 14px;
    font-size: .78rem; font-weight: 600; box-shadow: var(--shadow);
  }
  #ohd-archive .map-fab:hover { background: var(--surface); }
  #ohd-archive #reset-view { bottom: 26px; right: 14px; }
  #ohd-archive #mobile-list-toggle { display: none; bottom: 26px; left: 14px; }

  #ohd-archive /* ── Lightbox ─────────────────────────────────────── */
  #lightbox { display: none; position: fixed; inset: 0; z-index: 4000; background: #141414; flex-direction: column; }
  #ohd-archive #lightbox.open { display: flex; }
  #ohd-archive .lb-header {
    padding: 13px 58px 11px 20px; color: #fff; flex-shrink: 0;
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    border-bottom: 1px solid rgba(255,255,255,.1);
  }
  #ohd-archive .lb-header h2 { font-family: var(--serif); font-size: 1.15rem; font-weight: 400; }
  #ohd-archive .lb-header p { font-size: .76rem; color: #a8a8a8; }
  #ohd-archive .lb-desc {
    flex-basis: 100%; font-size: .78rem; line-height: 1.5; color: #d8d8d8;
    padding-left: 9px; border-left: 2px solid var(--accent); margin-top: 7px; max-width: 70ch;
  }
  #ohd-archive .lb-timeline {
    flex-shrink: 0; padding: 7px 20px 9px;
    border-top: 1px solid rgba(255,255,255,.1);
    background: rgba(0,0,0,.25);
  }
  #ohd-archive .lb-timeline .timeline { display: flex; }
  #ohd-archive .lb-timeline .tl-rail { background: #4a4a4a; }
  #ohd-archive .lb-timeline .tl-tick { background: #6d6d6d; }
  #ohd-archive .lb-timeline .tl-tick.has { background: #b9b9b9; }
  #ohd-archive .lb-timeline .tl-handle { background: #1c1c1c; border-color: var(--accent); }
  #ohd-archive .lb-timeline .tl-label { color: #f0f0f0; }
  #ohd-archive .lb-timeline .tl-count { color: #9a9a9a; }

<script>
(function () {
const OHD_BASEMAP = JSON.parse(document.getElementById('ohd-basemap').textContent);
const OHD_DATA    = JSON.parse(document.getElementById('ohd-data').textContent);

// The inlined data is columnar to fit the block size cap; rehydrate it into the
// shape the rest of the app already expects.
function expandData(c) {
  const yr = i => (i < 0 ? null : c.years[i]);
  const photo = ([f, y]) => {
    const path = c.files[f];
    return { clean_file: path, file: path.split('/').pop(), year: yr(y),
             original: path.split('/').pop() };
  };
  return {
    addresses: c.addr.map(([address, s, lat, lon, ph], i) => ({
      address, street: c.streets[s], lat, lon, photos: ph.map(photo),
      description: (c.desc && c.desc[i]) || '',
    })),
    scenes: c.scenes.map(([caption, f, y]) => ({
      caption, clean_file: c.files[f], file: c.files[f].split('/').pop(),
      original: c.files[f].split('/').pop(), year: yr(y), description: '',
    })),
  };
}

/* ─────────────────────────────────────────────────────────────────────────────
   Self-contained SVG slippy map. No Leaflet, no tiles, no network.

   Renders a static basemap (built once from OpenStreetMap by build_basemap.py)
   as inline SVG paths, and overlays address pins in the same coordinate space.
   Pan, zoom, pinch, and popups are all handled here.

   World coordinates are the basemap's own units: the projection below must stay
   in step with make_projector() in build_basemap.py.
   ──────────────────────────────────────────────────────────────────────────── */

const SVG_NS = 'http://www.w3.org/2000/svg';

function createMap(container, basemap, opts = {}) {
  const [S, W, N, E] = basemap.bbox;
  const WORLD_W = basemap.width, WORLD_H = basemap.height;

  // ── Projection (mirror of the Python build step) ───────────────────────────
  const merc = (lat, lon) => [
    lon * Math.PI / 180,
    Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360)),
  ];
  const [x0, y0] = merc(S, W);
  const [x1, y1] = merc(N, E);
  const sx = WORLD_W / (x1 - x0);
  const project = (lat, lon) => {
    const [x, y] = merc(lat, lon);
    return [(x - x0) * sx, (y1 - y) * sx];
  };

  // ── DOM ────────────────────────────────────────────────────────────────────
  container.classList.add('svgmap');
  container.innerHTML = `
    <svg class="svgmap-canvas" xmlns="${SVG_NS}">
      <g class="svgmap-world">
        <g class="svgmap-base"></g>
        <g class="svgmap-overlay"></g>
        <g class="svgmap-pins"></g>
        <g class="svgmap-labels"></g>
      </g>
    </svg>
    <div class="svgmap-popup" hidden></div>
    <div class="svgmap-zoom">
      <button class="svgmap-zoom-in"  aria-label="Zoom in">+</button>
      <button class="svgmap-zoom-out" aria-label="Zoom out">−</button>
    </div>
    <div class="svgmap-attrib">${basemap.attribution}</div>`;

  const svg      = container.querySelector('.svgmap-canvas');
  const gWorld   = container.querySelector('.svgmap-world');
  const gBase    = container.querySelector('.svgmap-base');
  const gOverlay = container.querySelector('.svgmap-overlay');
  const gPins    = container.querySelector('.svgmap-pins');
  const gLabels  = container.querySelector('.svgmap-labels');
  const popupEl  = container.querySelector('.svgmap-popup');

  // ── Basemap paths ──────────────────────────────────────────────────────────
  // Paint order matters: fills first, then casings, then road bodies, then rail.
  const ORDER = ['green', 'water', 'building', 'rail',
                 'path', 'road-service', 'road-minor', 'road-arterial', 'road-major'];
  for (const layer of ORDER) {
    const paths = basemap.layers[layer];
    if (!paths || !paths.length) continue;
    // One <path> per layer keeps the DOM small; these never need individual hits.
    const g = document.createElementNS(SVG_NS, 'g');
    g.setAttribute('class', 'lyr lyr-' + layer);
    if (layer.startsWith('road') || layer === 'rail' || layer === 'path') {
      const casing = document.createElementNS(SVG_NS, 'path');
      casing.setAttribute('class', 'casing');
      casing.setAttribute('d', paths.join(''));
      g.appendChild(casing);
    }
    const body = document.createElementNS(SVG_NS, 'path');
    body.setAttribute('class', 'body');
    body.setAttribute('d', paths.join(''));
    g.appendChild(body);
    gBase.appendChild(g);
  }

  // ── Street labels ──────────────────────────────────────────────────────────
  const labelEls = (basemap.labels || []).map(l => {
    const t = document.createElementNS(SVG_NS, 'text');
    t.setAttribute('class', 'svgmap-label r' + l.r);
    t.setAttribute('x', l.x);
    t.setAttribute('y', l.y);
    t.setAttribute('transform', `rotate(${l.a} ${l.x} ${l.y})`);
    t.textContent = l.t;
    gLabels.appendChild(t);
    return { el: t, rank: l.r };
  });

  // ── View transform ─────────────────────────────────────────────────────────
  let k = 1, tx = 0, ty = 0;              // screen = world * k + t
  let minK = 0.2, maxK = 24;
  let vw = 0, vh = 0;

  // Returns false while the container has no usable size — during initial layout,
  // and whenever the map is display:none (the Streetscapes tab). Callers must not
  // compute a view from a zero-sized box or every fit collapses to minK.
  function measure() {
    const r = container.getBoundingClientRect();
    if (r.width < 2 || r.height < 2) return false;
    vw = r.width; vh = r.height;
    svg.setAttribute('width', vw);
    svg.setAttribute('height', vh);
    // The whole world fitting on screen is as far out as anyone needs to go.
    minK = Math.min((vw - 48) / WORLD_W, (vh - 48) / WORLD_H) * 0.9;
    return true;
  }

  function apply() {
    gWorld.setAttribute('transform', `translate(${tx} ${ty}) scale(${k})`);
    // Counter-scale anything that must keep a constant screen size.
    container.style.setProperty('--k', k);
    // Pin radius is a screen measurement, so it has to undo the world scale.
    const pr = 5.5 / k;
    for (const p of pins.values()) {
      const r = p.big ? pr * 1.3 : pr;
      p.el.setAttribute('r', r);
      p.hit.setAttribute('r', Math.max(r * 2.1, 11 / k));   // comfortable tap target
    }
    for (const { el, rank } of labelEls) {
      el.style.display = (rank === 1 || k > (rank === 2 ? 1.6 : 3.2)) ? '' : 'none';
    }
    if (openPin) positionPopup(openPin);
    opts.onView && opts.onView(k);
  }

  function clamp() {
    k = Math.max(minK, Math.min(maxK, k));
    // Keep the world from being dragged entirely off screen.
    const w = WORLD_W * k, h = WORLD_H * k;
    const padX = Math.min(vw * 0.5, w * 0.5), padY = Math.min(vh * 0.5, h * 0.5);
    tx = Math.max(vw - w - padX, Math.min(padX, tx));
    ty = Math.max(vh - h - padY, Math.min(padY, ty));
  }

  function setView(nk, nx, ny) { k = nk; tx = nx; ty = ny; clamp(); apply(); }

  function fitWorldRect(rect, padding = 24, animate = false) {
    if (!measure()) { requestAnimationFrame(() => fitWorldRect(rect, padding, animate)); return; }
    const [ax, ay, bx, by] = rect;
    const w = Math.max(bx - ax, 1e-6), h = Math.max(by - ay, 1e-6);
    const target = Math.min((vw - padding * 2) / w, (vh - padding * 2) / h);
    const nk = Math.max(minK, Math.min(maxK, target));
    const nx = vw / 2 - (ax + bx) / 2 * nk;
    const ny = vh / 2 - (ay + by) / 2 * nk;
    animate ? animateTo(nk, nx, ny) : setView(nk, nx, ny);
  }

  let anim = null;
  function animateTo(nk, nx, ny, ms = 420) {
    cancelAnimationFrame(anim);
    const k0 = k, x0v = tx, y0v = ty, t0 = performance.now();
    const ease = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
    (function step(now) {
      const u = Math.min(1, (now - t0) / ms), e = ease(u);
      k = k0 + (nk - k0) * e; tx = x0v + (nx - x0v) * e; ty = y0v + (ny - y0v) * e;
      clamp(); apply();
      if (u < 1) anim = requestAnimationFrame(step);
    })(performance.now());
  }

  function zoomAbout(factor, cx, cy) {
    const nk = Math.max(minK, Math.min(maxK, k * factor));
    const r = nk / k;
    setView(nk, cx - (cx - tx) * r, cy - (cy - ty) * r);
  }

  // ── Interaction ────────────────────────────────────────────────────────────
  const pointers = new Map();
  let dragged = false, pinchStart = null;

  svg.addEventListener('pointerdown', e => {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, ox: e.clientX, oy: e.clientY });
    dragged = false;
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinchStart = { d: Math.hypot(a.x - b.x, a.y - b.y), k };
    }
  });

  svg.addEventListener('pointermove', e => {
    const p = pointers.get(e.pointerId);
    if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (pointers.size === 2 && pinchStart) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      const r = container.getBoundingClientRect();
      const cx = (a.x + b.x) / 2 - r.left, cy = (a.y + b.y) / 2 - r.top;
      zoomAbout((d / pinchStart.d) * pinchStart.k / k, cx, cy);
      dragged = true;
      return;
    }
    if (!dragged) {
      // Measured from where the press started, not per-event, so a slow drag still
      // registers and a shaky click does not. Below the threshold this stays a
      // click, and the pin under the cursor gets it.
      if (Math.hypot(e.clientX - p.ox, e.clientY - p.oy) < 4) return;
      dragged = true;
      // Capturing retargets the compatibility click event to the <svg>, so it can
      // only happen once we know this gesture is a drag.
      try { svg.setPointerCapture(e.pointerId); } catch (_) {}
    }
    tx += dx; ty += dy; clamp(); apply();
  });

  const endPointer = e => {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinchStart = null;
  };
  svg.addEventListener('pointerup', endPointer);
  svg.addEventListener('pointercancel', endPointer);

  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const r = container.getBoundingClientRect();
    // Trackpads report small deltas continuously; normalise so both feel the same.
    const factor = Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0022));
    zoomAbout(factor, e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });

  svg.addEventListener('dblclick', e => {
    const r = container.getBoundingClientRect();
    zoomAbout(2, e.clientX - r.left, e.clientY - r.top);
  });

  container.querySelector('.svgmap-zoom-in').addEventListener('click', () => zoomAbout(1.7, vw / 2, vh / 2));
  container.querySelector('.svgmap-zoom-out').addEventListener('click', () => zoomAbout(1 / 1.7, vw / 2, vh / 2));

  // ── Pins ───────────────────────────────────────────────────────────────────
  let pins = new Map();       // key -> { el, wx, wy, data }
  let openPin = null;

  function clearPins() {
    gPins.textContent = '';
    pins = new Map();
    closePopup();
  }

  function addPin(key, lat, lon, { big = false, data = null, onClick } = {}) {
    const [wx, wy] = project(lat, lon);
    const g = document.createElementNS(SVG_NS, 'g');
    g.setAttribute('class', 'svgmap-pin-g');
    const hit = document.createElementNS(SVG_NS, 'circle');
    hit.setAttribute('class', 'svgmap-hit');
    hit.setAttribute('cx', wx); hit.setAttribute('cy', wy);
    const el = document.createElementNS(SVG_NS, 'circle');
    el.setAttribute('class', 'svgmap-pin' + (big ? ' big' : ''));
    el.setAttribute('cx', wx); el.setAttribute('cy', wy);
    g.append(hit, el);

    const rec = { g, el, hit, wx, wy, data, big };
    const r0 = (big ? 1.3 : 1) * 5.5 / k;
    el.setAttribute('r', r0);
    hit.setAttribute('r', Math.max(r0 * 2.1, 11 / k));

    g.addEventListener('click', ev => {
      ev.stopPropagation();
      if (dragged) return;              // a drag that ends on a pin is not a click
      onClick && onClick(rec);
    });
    gPins.appendChild(g);
    pins.set(key, rec);
    return rec;
  }

  function setPinState(key, state) {
    for (const q of pins.values()) q.el.classList.remove('active');
    if (key == null || state !== 'active') return;
    const p = pins.get(key);
    if (!p) return;
    p.el.classList.add('active');
    gPins.appendChild(p.g);    // draw the active pin above its neighbours
  }

  function pinsBounds() {
    if (!pins.size) return [0, 0, WORLD_W, WORLD_H];
    let ax = Infinity, ay = Infinity, bx = -Infinity, by = -Infinity;
    for (const p of pins.values()) {
      ax = Math.min(ax, p.wx); ay = Math.min(ay, p.wy);
      bx = Math.max(bx, p.wx); by = Math.max(by, p.wy);
    }
    return [ax, ay, bx, by];
  }

  // ── Popup ──────────────────────────────────────────────────────────────────
  function positionPopup(rec) {
    popupEl.style.left = (rec.wx * k + tx) + 'px';
    popupEl.style.top  = (rec.wy * k + ty) + 'px';
  }

  function openPopup(rec, node) {
    popupEl.textContent = '';
    popupEl.appendChild(node);
    popupEl.hidden = false;
    openPin = rec;
    positionPopup(rec);
  }

  function closePopup() {
    popupEl.hidden = true;
    popupEl.textContent = '';
    openPin = null;
  }

  svg.addEventListener('click', e => { if (!dragged && e.target === svg) closePopup(); });

  // ── Overlay shapes (the district boundary) ─────────────────────────────────
  function drawPolygon(latlngs, cls) {
    const d = latlngs.map(([la, lo], i) => {
      const [x, y] = project(la, lo);
      return (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
    }).join('') + 'Z';
    const p = document.createElementNS(SVG_NS, 'path');
    p.setAttribute('class', cls);
    p.setAttribute('d', d);
    gOverlay.appendChild(p);
    return p;
  }

  // ── Boot ───────────────────────────────────────────────────────────────────
  fitWorldRect([0, 0, WORLD_W, WORLD_H]);

  const ro = new ResizeObserver(() => {
    const o = { k, tx, ty };
    if (!measure()) return;
    k = o.k; tx = o.tx; ty = o.ty; clamp(); apply();
  });
  ro.observe(container);

  return {
    project, addPin, clearPins, setPinState, pinsBounds,
    openPopup, closePopup, drawPolygon, fitWorldRect,
    pinFor(key) { return pins.get(key) || null; },
    openPopupFor(key, node) {
      const rec = pins.get(key);
      if (rec) openPopup(rec, node);
    },
    flyToWorld(wx, wy, nk) {
      if (!measure()) return;
      animateTo(nk, vw / 2 - wx * nk, vh / 2 - wy * nk);
    },
    flyToLatLon(lat, lon, nk) {
      const [wx, wy] = project(lat, lon);
      this.flyToWorld(wx, wy, nk);
    },
    get zoom() { return k; },
    invalidate() { if (measure()) { clamp(); apply(); } },
  };
}




// ── Config ───────────────────────────────────────────────────────────────────
const BUILD = '2026-09-22a';   // bump when data.json or basemap.json changes
const THUMB_URL = './thumbs/';
const VIEW_URL  = './view/';
const FULL_URL  = './view/';   // originals stay offline; see README

const DISTRICT_BOUNDARY = [
  [39.7567803, -84.1877067], [39.7552889, -84.1880046], [39.7544779, -84.1884901],
  [39.7526828, -84.1879968], [39.7530334, -84.1847218], [39.7533345, -84.1814362],
  [39.7542334, -84.1761951], [39.7558479, -84.1767363], [39.7575119, -84.1771918],
  [39.7631203, -84.1787841], [39.7567803, -84.1877067]
];

// ── Path helpers ─────────────────────────────────────────────────────────────
const relPath  = p => p.clean_file || p.file;
const webpPath = p => relPath(p).replace(/\.jpe?g$/i, '.webp');
const thumbSrc = p => THUMB_URL + encodeURI(webpPath(p));
const viewSrc  = p => VIEW_URL  + encodeURI(webpPath(p));
const fullSrc  = p => FULL_URL  + encodeURI(webpPath(p));

const yearsOf = photos => [...new Set(photos.map(p => p.year).filter(Boolean))].sort();
function yearRange(photos) {
  const y = yearsOf(photos);
  if (!y.length) return 'undated';
  return y.length === 1 ? y[0] : `${y[0]}–${y[y.length - 1]}`;
}

// ── State ────────────────────────────────────────────────────────────────────
let MAP = null;
let ALL_ADDRESSES = [], ALL_SCENES = [];
let activeAddress = null, activeYears = new Set(), searchTerm = '';
let lbEntry = null;   // the address or scene set the viewer is showing
let HOME_RECT = null;

// ── Load ─────────────────────────────────────────────────────────────────────
function loadData() {
  const basemap = OHD_BASEMAP, data = expandData(OHD_DATA);

  MAP = createMap(document.getElementById('map'), basemap);
  MAP.drawPolygon(DISTRICT_BOUNDARY, 'district-boundary');

  ALL_ADDRESSES = data.addresses;
  ALL_SCENES = data.scenes || [];

  buildYearControl();
  applyFilters();

  // Frame on the photographed addresses, which is tighter than the whole basemap.
  HOME_RECT = MAP.pinsBounds();
  MAP.fitWorldRect(HOME_RECT, 30);

  restoreFromHash();
}

// ── Filtering ────────────────────────────────────────────────────────────────
function matchesFilters(entry) {
  if (searchTerm) {
    const hay = (entry.address + ' ' + entry.street).toLowerCase();
    if (!hay.includes(searchTerm)) return false;
  }
  if (activeYears.size) {
    const has = entry.photos.some(p => activeYears.has(p.year) || (activeYears.has('undated') && !p.year));
    if (!has) return false;
  }
  return true;
}
function visiblePhotos(entry) {
  if (!activeYears.size) return entry.photos;
  return entry.photos.filter(p => activeYears.has(p.year) || (activeYears.has('undated') && !p.year));
}
function applyFilters() {
  const filtered = ALL_ADDRESSES.filter(matchesFilters);
  renderSidebar(filtered);
  placePins(filtered);
  refreshOpenViewer();
}

// ── Year control: chips and timeline over one shared state ───────────────────
// activeYears is the single source of truth. Chips toggle many; the timeline
// picks one. Both views re-sync from the set, so switching modes never lies.
let ALL_YEARS = [], YEAR_COUNTS = {}, TL_STOPS = [];

function buildYearControl() {
  const row = document.getElementById('year-chips');
  YEAR_COUNTS = {};
  ALL_ADDRESSES.forEach(a => a.photos.forEach(p => {
    const k = p.year || 'undated'; YEAR_COUNTS[k] = (YEAR_COUNTS[k] || 0) + 1;
  }));
  ALL_SCENES.forEach(s => { const k = s.year || 'undated'; YEAR_COUNTS[k] = (YEAR_COUNTS[k] || 0) + 1; });

  ALL_YEARS = Object.keys(YEAR_COUNTS).filter(k => k !== 'undated').sort();
  TL_STOPS = ['all', ...ALL_YEARS];
  if (YEAR_COUNTS.undated) TL_STOPS.push('undated');

  const keys = [...ALL_YEARS];
  if (YEAR_COUNTS.undated) keys.push('undated');

  keys.forEach(k => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.dataset.year = k;
    b.textContent = k === 'undated' ? `Undated (${YEAR_COUNTS[k]})` : `${k} (${YEAR_COUNTS[k]})`;
    b.addEventListener('click', () => {
      activeYears.has(k) ? activeYears.delete(k) : activeYears.add(k);
      syncYearUI(); applyFilters();
    });
    row.appendChild(b);
  });

  const reset = document.createElement('button');
  reset.className = 'chip-reset';
  reset.id = 'chip-reset';
  reset.textContent = 'Clear';
  reset.addEventListener('click', () => { activeYears.clear(); syncYearUI(); applyFilters(); });
  row.appendChild(reset);

  buildTimeline(document.getElementById('timeline-main'));
  buildTimeline(document.getElementById('timeline-lb'));

  const modeBtn = document.getElementById('year-mode');
  modeBtn.addEventListener('click', () => {
    const on = document.body.classList.toggle('timeline-mode');
    modeBtn.textContent = on ? 'Year chips ▸' : 'Timeline ▸';
    syncYearUI();
  });

  syncYearUI();
}

function buildTimeline(host) {
  host.innerHTML = `
    <div class="tl-track" role="slider" tabindex="0" aria-label="Filter by year"
         aria-valuemin="0" aria-valuemax="${TL_STOPS.length - 1}">
      <div class="tl-rail"></div><div class="tl-fill"></div>
      <div class="tl-ticks"></div><div class="tl-handle"></div>
    </div>
    <span class="tl-label"></span>
    <span class="tl-count"></span>`;

  const track = host.querySelector('.tl-track');
  const ticks = host.querySelector('.tl-ticks');
  TL_STOPS.forEach((stop, i) => {
    const t = document.createElement('div');
    t.className = 'tl-tick' + (stop === 'all' ? '' : ' has');
    t.style.left = pctFor(i) + '%';
    t.dataset.stop = stop;
    ticks.appendChild(t);
  });

  const pick = clientX => {
    const r = track.getBoundingClientRect();
    const frac = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
    setYearStop(TL_STOPS[Math.round(frac * (TL_STOPS.length - 1))]);
  };
  let sliding = false;
  track.addEventListener('pointerdown', e => {
    sliding = true; track.setPointerCapture(e.pointerId); pick(e.clientX);
  });
  track.addEventListener('pointermove', e => { if (sliding) pick(e.clientX); });
  track.addEventListener('pointerup', () => { sliding = false; });
  track.addEventListener('pointercancel', () => { sliding = false; });
  track.addEventListener('keydown', e => {
    const i = currentStopIndex();
    if (e.key === 'ArrowRight') { setYearStop(TL_STOPS[Math.min(TL_STOPS.length - 1, i + 1)]); e.preventDefault(); }
    if (e.key === 'ArrowLeft')  { setYearStop(TL_STOPS[Math.max(0, i - 1)]); e.preventDefault(); }
  });
}

const pctFor = i => (TL_STOPS.length < 2 ? 0 : (i / (TL_STOPS.length - 1)) * 100);

function currentStopIndex() {
  if (activeYears.size !== 1) return 0;
  const only = [...activeYears][0];
  const i = TL_STOPS.indexOf(only);
  return i < 0 ? 0 : i;
}

function setYearStop(stop) {
  activeYears.clear();
  if (stop && stop !== 'all') activeYears.add(stop);
  syncYearUI();
  applyFilters();
}

// Redraw every year control from activeYears.
function syncYearUI() {
  document.querySelectorAll('.chip[data-year]').forEach(c =>
    c.classList.toggle('on', activeYears.has(c.dataset.year)));
  const reset = document.getElementById('chip-reset');
  if (reset) reset.style.display = activeYears.size ? 'block' : 'none';

  const i = currentStopIndex();
  const stop = TL_STOPS[i];
  const multi = activeYears.size > 1;

  // While the viewer is open, dim the years this address has nothing from.
  const present = lbYears();

  document.querySelectorAll('.timeline').forEach(host => {
    const isLb = host.id === 'timeline-lb';
    host.querySelector('.tl-handle').style.left = pctFor(i) + '%';
    host.querySelector('.tl-fill').style.width = pctFor(i) + '%';
    host.querySelector('.tl-track').setAttribute('aria-valuenow', i);
    host.querySelector('.tl-track').setAttribute('aria-valuetext',
      multi ? `${activeYears.size} years selected` : (stop === 'all' ? 'All years' : stop));
    host.querySelectorAll('.tl-tick').forEach(t =>
      t.classList.toggle('dim', isLb && present && t.dataset.stop !== 'all' && !present.has(t.dataset.stop)));
    host.querySelector('.tl-label').textContent =
      multi ? `${activeYears.size} years` : (stop === 'all' ? 'All years' : (stop === 'undated' ? 'Undated' : stop));
    host.querySelector('.tl-count').textContent =
      multi || stop === 'all' ? '' : `${YEAR_COUNTS[stop] || 0} photos`;
  });
}

// Years available for whatever the viewer currently shows, or null when closed.
function lbYears() {
  if (!lbEntry) return null;
  const src = lbEntry.photos || [];
  const set = new Set(src.map(p => p.year).filter(Boolean));
  if (src.some(p => !p.year)) set.add('undated');
  return set;
}

// ── Sidebar ──────────────────────────────────────────────────────────────────
const openGroups = new Set();          // streets the user has opened, by name

function renderSidebar(addresses) {
  const list = document.getElementById('addr-list');
  const countEl = document.getElementById('sidebar-count');
  list.innerHTML = '';

  const scenes = filteredScenes();
  const totalPhotos = addresses.reduce((s, a) => s + visiblePhotos(a).length, 0);
  countEl.textContent =
    `${addresses.length} address${addresses.length !== 1 ? 'es' : ''} · ${totalPhotos} photo${totalPhotos !== 1 ? 's' : ''}`;

  if (!addresses.length && !scenes.length) {
    list.innerHTML = '<div class="empty-note">Nothing matches this filter.<br>Try another year or clear the search box.</div>';
    return;
  }

  // A search or year filter is a request to see inside, so groups open then.
  const forceOpen = !!searchTerm || activeYears.size > 0;
  const grouped = {};
  addresses.forEach(a => (grouped[a.street] ||= []).push(a));

  const frag = document.createDocumentFragment();

  Object.keys(grouped).sort().forEach(street => {
    const entries = grouped[street];
    const n = entries.reduce((s, a) => s + visiblePhotos(a).length, 0);
    frag.appendChild(makeGroup({
      key: street,
      title: street,
      meta: `${entries.length} addr · ${n} photos`,
      open: forceOpen || openGroups.has(street),
      tiles: entries.map(entry => makeTile({
        key: entry.address,
        cover: visiblePhotos(entry)[0],
        title: entry.address,
        meta: yearRange(visiblePhotos(entry)),
        count: visiblePhotos(entry).length,
        active: entry.address === activeAddress,
        onClick: () => selectAddress(entry),
      })),
    }));
  });

  // Streetscapes are not tied to an address, so they get their own group rather
  // than the separate tab this used to need.
  if (scenes.length) {
    frag.appendChild(makeGroup({
      key: '__scenes',
      title: 'Streetscapes',
      meta: `${scenes.length} view${scenes.length !== 1 ? 's' : ''}`,
      open: forceOpen || openGroups.has('__scenes'),
      scenes: true,
      tiles: scenes.map((sc, i) => makeTile({
        key: 'scene:' + i,
        cover: sceneAsPhoto(sc),
        title: sc.caption,
        meta: sc.year || 'Undated',
        active: false,
        onClick: () => openViewer({
          title: 'Streetscapes',
          entry: { photos: scenes.map(sceneAsPhoto), description: sc.description || '' },
          photos: scenes.map(sceneAsPhoto),
          startIndex: i,
          subtitle: `${scenes.length} view${scenes.length !== 1 ? 's' : ''} · Oregon Historic District`,
        }),
      })),
    }));
  }

  list.appendChild(frag);
}

function makeGroup({ key, title, meta, open, tiles, scenes = false }) {
  const group = document.createElement('div');
  group.className = 'street-group' + (open ? '' : ' collapsed') + (scenes ? ' scenes' : '');
  group.dataset.street = key;

  const head = document.createElement('button');
  head.type = 'button';
  head.className = 'street-head';
  head.setAttribute('aria-expanded', String(!!open));
  head.innerHTML = `
    <span class="street-head-left">
      <span class="street-chevron">▼</span>
      <span class="street-name">${title}</span>
    </span>
    <span class="street-photo-count">${meta}</span>`;
  head.addEventListener('click', () => {
    const nowClosed = group.classList.toggle('collapsed');
    nowClosed ? openGroups.delete(key) : openGroups.add(key);
    head.setAttribute('aria-expanded', String(!nowClosed));
  });

  const grid = document.createElement('div');
  grid.className = 'tile-grid';
  tiles.forEach(t => grid.appendChild(t));

  group.append(head, grid);
  return group;
}

function makeTile({ key, cover, title, meta, count, active, onClick }) {
  const tile = document.createElement('button');
  tile.type = 'button';
  tile.className = 'tile' + (active ? ' active' : '');
  tile.dataset.address = key;
  tile.innerHTML = `
    ${cover
      ? `<img class="tile-img" src="${thumbSrc(cover)}" alt="" loading="lazy" decoding="async">`
      : `<div class="tile-img none">no photo</div>`}
    ${count != null ? `<span class="tile-count">${count}</span>` : ''}
    <span class="tile-body">
      <span class="tile-addr">${title}</span>
      <span class="tile-meta">${meta}</span>
    </span>`;
  tile.addEventListener('click', onClick);
  return tile;
}

// ── Streetscapes data ────────────────────────────────────────────────────────
function sceneAsPhoto(s) {
  return { clean_file: s.clean_file || ('_scenes/' + s.original), file: s.file,
           year: s.year, caption: s.caption };
}
function filteredScenes() {
  return ALL_SCENES.filter(s => {
    if (activeYears.size && !(activeYears.has(s.year) || (activeYears.has('undated') && !s.year))) return false;
    if (searchTerm && !s.caption.toLowerCase().includes(searchTerm)) return false;
    return true;
  });
}

// ── Pins ─────────────────────────────────────────────────────────────────────
function placePins(addresses) {
  MAP.clearPins();
  addresses.forEach(entry => {
    if (!entry.lat || !entry.lon) return;
    const shown = visiblePhotos(entry);
    MAP.addPin(entry.address, entry.lat, entry.lon, {
      big: shown.length > 5,
      data: entry,
      onClick: rec => { setActive(entry.address); MAP.openPopup(rec, buildPopup(entry)); },
    });
  });
  if (activeAddress) MAP.setPinState(activeAddress, 'active');
}

function buildPopup(entry) {
  const shown = visiblePhotos(entry);
  const div = document.createElement('div');
  const cover = shown[0];
  const desc = (entry.description || '').trim();

  div.innerHTML = `
    ${cover ? `<img class="popup-thumb" src="${thumbSrc(cover)}" alt="${entry.address}" loading="lazy">` : ''}
    <div class="popup-body">
      <h3>${entry.address}</h3>
      <div class="popup-meta">${shown.length} photo${shown.length !== 1 ? 's' : ''} · ${yearRange(shown)}</div>
      ${desc ? `<div class="popup-desc">${desc}</div>` : ''}
      ${shown.length > 1 ? '<div class="popup-gallery"></div>' : ''}
      <button class="popup-btn">View all photos</button>
    </div>`;

  let previewIndex = 0;
  const gallery = div.querySelector('.popup-gallery');
  if (gallery) {
    shown.forEach((p, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'popup-gthumb' + (i === 0 ? ' current' : '');
      b.title = p.year || 'undated';
      b.innerHTML = `<img src="${thumbSrc(p)}" alt="" loading="lazy"><span>${p.year || '—'}</span>`;
      b.addEventListener('click', ev => {
        ev.stopPropagation();
        previewIndex = i;
        const big = div.querySelector('.popup-thumb');
        if (big) big.src = thumbSrc(p);
        div.querySelector('.popup-meta').textContent =
          `${p.year || 'undated'} · photo ${i + 1} of ${shown.length}`;
        gallery.querySelectorAll('.popup-gthumb').forEach((el, n) => el.classList.toggle('current', n === i));
      });
      gallery.appendChild(b);
    });
  }

  div.querySelector('.popup-btn').addEventListener('click', () => openLightbox(entry));
  const big = div.querySelector('.popup-thumb');
  if (big) {
    big.title = 'Open this photo';
    big.addEventListener('click', () => openLightbox(entry, previewIndex));
  }
  return div;
}

// ── Selection ────────────────────────────────────────────────────────────────
function setActive(address) {
  activeAddress = address;
  document.querySelectorAll('.tile').forEach(el => el.classList.toggle('active', el.dataset.address === address));
  const tile = document.querySelector('.tile.active');
  if (tile) {
    tile.closest('.street-group')?.classList.remove('collapsed');
    tile.scrollIntoView({ block: 'nearest' });
  }
  MAP.setPinState(address, 'active');
}

function selectAddress(entry) {
  setActive(entry.address);
  document.body.classList.remove('list-open');
  if (entry.lat && entry.lon) {
    MAP.flyToLatLon(entry.lat, entry.lon, Math.max(MAP.zoom, 6));
    setTimeout(() => MAP.openPopupFor(entry.address, buildPopup(entry)), 440);
  } else {
    openLightbox(entry);
  }
}

// ── Search ───────────────────────────────────────────────────────────────────
const searchInput = document.getElementById('search-input');
searchInput.addEventListener('input', function () {
  searchTerm = this.value.toLowerCase().trim();
  applyFilters();
});
document.getElementById('search-clear').addEventListener('click', () => {
  searchInput.value = ''; searchTerm = ''; applyFilters(); searchInput.focus();
});

// ── Lightbox ─────────────────────────────────────────────────────────────────
let lbPhotos = [], lbIndex = 0, compareMode = false, comparePick = null;

function openLightbox(entry, startIndex = 0) {
  const shown = visiblePhotos(entry);
  openViewer({
    title: entry.address,
    entry,
    photos: shown,
    startIndex,
    subtitle: `${shown.length} photo${shown.length !== 1 ? 's' : ''} · ${yearRange(shown)} · ${entry.street}`,
    canCompare: yearsOf(shown).length > 1,
  });
  location.hash = 'a=' + encodeURIComponent(entry.address);
}

// The year control stays live while the viewer is open, so re-run the open entry
// through the current filter instead of closing on the user.
function refreshOpenViewer() {
  if (!lbEntry) return;
  if (lbEntry.address) {
    const shown = visiblePhotos(lbEntry);
    if (!shown.length) { showViewerEmpty(); return; }
    openViewer({
      title: lbEntry.address,
      entry: lbEntry,
      photos: shown,
      startIndex: 0,
      subtitle: `${shown.length} photo${shown.length !== 1 ? 's' : ''} · ${yearRange(shown)} · ${lbEntry.street}`,
      canCompare: yearsOf(shown).length > 1,
    });
  } else {
    const scenes = filteredScenes();
    if (!scenes.length) { showViewerEmpty(); return; }
    openViewer({
      title: 'Streetscapes',
      entry: { photos: scenes.map(sceneAsPhoto), description: '' },
      photos: scenes.map(sceneAsPhoto),
      startIndex: 0,
      subtitle: `${scenes.length} view${scenes.length !== 1 ? 's' : ''} · Oregon Historic District`,
    });
  }
}

function showViewerEmpty() {
  document.getElementById('lb-img').removeAttribute('src');
  document.getElementById('lb-thumbs').innerHTML = '';
  document.getElementById('lb-counter').textContent = '';
  document.getElementById('lb-caption').textContent = 'Nothing here from the selected year.';
  document.getElementById('lb-compare').style.display = 'none';
  document.getElementById('lb-stage').classList.remove('compare');
}

function openViewer({ title, entry = null, photos, startIndex = 0, subtitle = '', canCompare = false }) {
  if (!photos.length) return;
  lbPhotos = photos; lbIndex = startIndex; lbEntry = entry;
  compareMode = false; comparePick = null;
  document.getElementById('lb-title').textContent = title;
  document.getElementById('lb-subtitle').textContent = subtitle;

  const descEl = document.getElementById('lb-desc');
  const desc = ((entry && entry.description) || '').trim();
  descEl.textContent = desc;
  descEl.hidden = !desc;
  const cmpBtn = document.getElementById('lb-compare');
  cmpBtn.style.display = canCompare ? 'block' : 'none';
  cmpBtn.classList.remove('on');
  cmpBtn.textContent = 'Compare years';
  document.getElementById('lb-stage').classList.remove('compare');
  buildThumbs();
  showPhoto(lbIndex);
  document.getElementById('lightbox').classList.add('open');
  syncYearUI();            // dims the years this entry has nothing from
}

function buildThumbs() {
  const c = document.getElementById('lb-thumbs');
  c.innerHTML = '';
  lbPhotos.forEach((p, i) => {
    const img = document.createElement('img');
    img.className = 'lb-thumb' + (i === lbIndex ? ' active' : '');
    img.src = thumbSrc(p);
    img.loading = 'lazy';
    img.title = p.year || 'undated';
    img.addEventListener('click', () => compareMode ? setComparePick(i) : showPhoto(i));
    c.appendChild(img);
  });
}

function showPhoto(index) {
  lbIndex = index;
  const p = lbPhotos[index];
  const img = document.getElementById('lb-img');
  img.src = viewSrc(p);
  img.alt = p.caption || `${document.getElementById('lb-title').textContent} ${p.year || ''}`.trim();
  document.getElementById('lb-counter').textContent = `${index + 1} / ${lbPhotos.length}`;
  document.getElementById('lb-caption').textContent =
    (p.caption || p.original || '').replace(/\.jpe?g$/i, '') + (p.year ? '' : '  (undated)');
  document.getElementById('lb-full').href = fullSrc(p);
  document.getElementById('main-tag').textContent = p.year || 'undated';
  document.querySelectorAll('.lb-thumb').forEach((el, i) => el.classList.toggle('active', i === index));
  document.querySelector('.lb-thumb.active')?.scrollIntoView({ inline: 'nearest', block: 'nearest' });
  if (compareMode) updateComparePane();
  [index - 1, index + 1].forEach(i => { if (lbPhotos[i]) new Image().src = viewSrc(lbPhotos[i]); });
}

function setComparePick(i) {
  comparePick = i;
  updateComparePane();
}
function updateComparePane() {
  if (comparePick == null) {
    const cur = lbPhotos[lbIndex].year;
    let best = null, bestGap = -1;
    lbPhotos.forEach((p, i) => {
      if (i === lbIndex || !p.year || !cur) return;
      const gap = Math.abs(+p.year - +cur);
      if (gap > bestGap) { bestGap = gap; best = i; }
    });
    comparePick = best != null ? best : (lbIndex + 1) % lbPhotos.length;
  }
  const p = lbPhotos[comparePick];
  document.getElementById('cmp-img').src = viewSrc(p);
  document.getElementById('cmp-tag').textContent = p.year || 'undated';
  document.querySelectorAll('.lb-thumb').forEach((el, n) => el.classList.toggle('cmp-pick', n === comparePick));
}
document.getElementById('lb-compare').addEventListener('click', function () {
  compareMode = !compareMode;
  this.classList.toggle('on', compareMode);
  this.textContent = compareMode ? 'Pick from strip ↓' : 'Compare years';
  document.getElementById('lb-stage').classList.toggle('compare', compareMode);
  if (compareMode) updateComparePane();
  else { comparePick = null; document.querySelectorAll('.lb-thumb').forEach(el => el.classList.remove('cmp-pick')); }
});

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  lbEntry = null;
  syncYearUI();
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
}
document.getElementById('lb-close').addEventListener('click', closeLightbox);
document.getElementById('lb-prev').addEventListener('click', () => showPhoto((lbIndex - 1 + lbPhotos.length) % lbPhotos.length));
document.getElementById('lb-next').addEventListener('click', () => showPhoto((lbIndex + 1) % lbPhotos.length));
document.getElementById('lightbox').addEventListener('click', e => {
  if (e.target.id === 'lightbox' || e.target.id === 'lb-stage') closeLightbox();
});
document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowRight') showPhoto((lbIndex + 1) % lbPhotos.length);
  if (e.key === 'ArrowLeft') showPhoto((lbIndex - 1 + lbPhotos.length) % lbPhotos.length);
});

// ── Map controls ─────────────────────────────────────────────────────────────
document.getElementById('reset-view').addEventListener('click', () => {
  activeAddress = null;
  document.querySelectorAll('.tile').forEach(el => el.classList.remove('active'));
  MAP.setPinState(null, null);
  MAP.closePopup();
  MAP.fitWorldRect(HOME_RECT || MAP.pinsBounds(), 30, true);
});
document.getElementById('mobile-list-toggle').addEventListener('click', () => document.body.classList.add('list-open'));
document.getElementById('list-close').addEventListener('click', () => document.body.classList.remove('list-open'));

// ── Deep link ────────────────────────────────────────────────────────────────
function restoreFromHash() {
  const m = /a=([^&]+)/.exec(location.hash);
  if (!m) return;
  const addr = decodeURIComponent(m[1]);
  const entry = ALL_ADDRESSES.find(a => a.address === addr);
  if (entry) { setActive(addr); openLightbox(entry); }
}

loadData();

})();
</script>
